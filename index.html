<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tower Defense</title>
    <link rel="manifest" href="manifest.json">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            height: 100%;
            overflow: hidden;
            background: #1a1a2e;
            font-family: 'Segoe UI', sans-serif;
            color: #eee;
        }
        #app {
            display: flex;
            flex-direction: column;
            height: 100%;
            max-width: 500px;
            margin: 0 auto;
        }
        #game-header {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 6px 10px;
            background: #16213e;
            flex-shrink: 0;
        }
        .stat { display: flex; align-items: center; gap: 3px; font-size: 12px; }
        .stat-icon { font-size: 14px; }
        #game-container {
            flex: 1;
            position: relative;
            touch-action: none;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background: #0f0f23;
        }
        #game-canvas { display: block; }
        #tower-panel {
            display: flex;
            justify-content: center;
            gap: 4px;
            padding: 6px;
            background: #16213e;
            flex-shrink: 0;
            flex-wrap: wrap;
            max-height: 80px;
            overflow-y: auto;
        }
        .tower-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 4px 6px;
            border: 2px solid #333;
            border-radius: 6px;
            background: #1a1a2e;
            color: #eee;
            cursor: pointer;
            min-width: 48px;
        }
        .tower-btn.selected { border-color: #4a9eff; background: #2a2a5a; }
        .tower-btn.disabled { opacity: 0.5; }
        .tower-icon { font-size: 16px; }
        .tower-name { font-size: 8px; font-weight: bold; }
        .tower-cost { font-size: 7px; color: #ffd700; }
        #wave-info {
            padding: 8px;
            background: #16213e;
            text-align: center;
            flex-shrink: 0;
        }
        #start-btn {
            padding: 10px 25px;
            font-size: 14px;
            background: #4a9eff;
            border: none;
            border-radius: 6px;
            color: white;
            cursor: pointer;
        }
        #start-btn:disabled { opacity: 0.7; }
        #upgrade-panel {
            display: none;
            position: absolute;
            background: #16213e;
            border: 2px solid #4a9eff;
            border-radius: 8px;
            padding: 8px;
            z-index: 100;
            min-width: 130px;
            font-size: 12px;
        }
        #upgrade-panel h3 { font-size: 12px; margin-bottom: 5px; color: #4a9eff; }
        .upgrade-btn {
            display: block;
            width: 100%;
            padding: 6px;
            margin: 3px 0;
            border: 1px solid #444;
            border-radius: 4px;
            background: #1a1a2e;
            color: #eee;
            cursor: pointer;
            font-size: 11px;
        }
        .upgrade-btn:disabled { opacity: 0.5; }
        #game-over, #weapon-select {
            display: none;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            z-index: 200;
            max-width: 90%;
            max-height: 80%;
            overflow-y: auto;
        }
        #game-over h2, #weapon-select h2 { font-size: 20px; margin-bottom: 10px; }
        .victory { color: #4aff4a; }
        .defeat { color: #ff4a4a; }
        #restart-btn {
            padding: 10px 25px;
            font-size: 14px;
            background: #4a9eff;
            border: none;
            border-radius: 5px;
            color: white;
            cursor: pointer;
            margin-top: 10px;
        }
        #weapon-select h2 { color: #ffd700; }
        .weapon-choice {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            padding: 6px 8px;
            margin: 3px;
            border: 2px solid #444;
            border-radius: 6px;
            background: #1a1a2e;
            cursor: pointer;
            min-width: 50px;
            transition: all 0.2s;
        }
        .weapon-choice:hover { border-color: #4a9eff; background: #2a2a5a; }
        .weapon-choice .icon { font-size: 18px; }
        .weapon-choice .name { font-size: 9px; font-weight: bold; }
        #weapon-choices { display: flex; flex-wrap: wrap; justify-content: center; }
        #inventory-info { margin-top: 10px; font-size: 11px; color: #ff6b6b; }
        #discard-section { margin-top: 15px; padding-top: 10px; border-top: 1px solid #444; }
        #discard-section h3 { font-size: 12px; color: #ff6b6b; margin-bottom: 8px; }
        .discard-btn {
            display: inline-block;
            padding: 6px 10px;
            margin: 3px;
            border: 2px solid #ff4a4a;
            border-radius: 6px;
            background: #2a1a1a;
            cursor: pointer;
            font-size: 10px;
        }
        .discard-btn:hover { background: #4a1a1a; }
        #tutorial {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.92);
            z-index: 300;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
        }
        #tutorial h2 { color: #4a9eff; margin-bottom: 15px; font-size: 22px; }
        #tutorial p { margin: 6px 0; font-size: 14px; }
        .step { color: #ffd700; }
        #start-game-btn {
            margin-top: 20px;
            padding: 12px 30px;
            font-size: 16px;
            background: #4a9eff;
            border: none;
            border-radius: 8px;
            color: white;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="tutorial">
        <h2>🏰 タワーディフェンス</h2>
        <div>
            <p><span class="step">①</span> 下のタワーを選んでタップ</p>
            <p><span class="step">②</span> 青エリア（下部）に配置</p>
            <p><span class="step">③</span> 「開始」ボタンで敵が来る</p>
            <p><span class="step">④</span> 敵を倒してゴールドGET</p>
            <p style="color:#ffd700; margin-top:12px;">🎁 ウェーブクリアで新武器GET!</p>
            <p style="color:#ff6b6b;">⚠️ 手持ちは最大6種類まで</p>
        </div>
        <button id="start-game-btn">ゲームスタート！</button>
        <div style="position:absolute; bottom:10px; right:10px; font-size:10px; color:#666;">v2.2.0</div>
    </div>

    <div id="app">
        <div id="game-header">
            <div class="stat"><span class="stat-icon">💰</span><span id="gold">150</span></div>
            <div class="stat"><span class="stat-icon">❤️</span><span id="lives">20</span></div>
            <div class="stat"><span class="stat-icon">🌊</span><span id="wave">0</span>/<span id="max-wave">15</span></div>
            <div class="stat"><span class="stat-icon">💀</span><span id="kills">0</span></div>
        </div>

        <div id="game-container">
            <canvas id="game-canvas"></canvas>
            <div id="upgrade-panel">
                <h3 id="upgrade-title">タワー</h3>
                <div id="upgrade-info"></div>
                <button id="upgrade-btn" class="upgrade-btn">アップグレード</button>
                <button id="sell-btn" class="upgrade-btn">売却</button>
                <button id="close-panel" class="upgrade-btn">閉じる</button>
            </div>
            <div id="game-over">
                <h2 id="result-text">GAME OVER</h2>
                <p id="result-detail"></p>
                <button id="restart-btn">もう一度</button>
            </div>
            <div id="weapon-select">
                <h2>🎁 新しい武器を選べ！</h2>
                <div id="weapon-choices"></div>
                <div id="inventory-info"></div>
                <div id="discard-section" style="display:none;">
                    <h3>🗑️ 武器を捨てる（6個制限）</h3>
                    <div id="discard-choices"></div>
                </div>
            </div>
        </div>

        <div id="tower-panel"></div>

        <div id="wave-info">
            <button id="start-btn">🚀 ウェーブ開始</button>
        </div>
    </div>

    <script>
        // ゲーム設定
        let CONFIG = { COLS: 10, ROWS: 12, TOWER_ZONE_START: 8 };
        let GRID_SIZE = 32;
        const MAX_WEAPONS = 6;

        // 全武器データ（18種類）
        const ALL_WEAPONS = {
            basic: { name: 'ベーシック', icon: '🔫', cost: 50, damage: 10, range: 2.5, fireRate: 1000, color: '#4a9eff', bulletSpeed: 8, desc: '基本の武器', tier: 0 },
            rapid: { name: 'ラピッド', icon: '⚡', cost: 60, damage: 6, range: 2.2, fireRate: 400, color: '#ffeb3b', bulletSpeed: 10, desc: '超高速連射', tier: 1 },
            shotgun: { name: '散弾銃', icon: '🔥', cost: 80, damage: 8, range: 1.8, fireRate: 1200, color: '#ff9f43', bulletSpeed: 12, shotCount: 5, spread: 0.4, desc: '近距離5方向', tier: 1 },
            sniper: { name: 'スナイパー', icon: '🎯', cost: 100, damage: 50, range: 6, fireRate: 2500, color: '#9c27b0', bulletSpeed: 20, desc: '超長射程', tier: 2 },
            freeze: { name: 'フリーズ', icon: '❄️', cost: 90, damage: 5, range: 2.5, fireRate: 800, color: '#00bcd4', bulletSpeed: 8, isFreeze: true, slowDuration: 2000, desc: '敵を減速', tier: 1 },
            laser: { name: 'レーザー', icon: '💥', cost: 120, damage: 25, range: 6, fireRate: 800, color: '#ff4757', isLaser: true, desc: '貫通ビーム', tier: 2 },
            missile: { name: 'ミサイル', icon: '🚀', cost: 130, damage: 40, range: 4, fireRate: 2000, color: '#5f27cd', bulletSpeed: 4, isMissile: true, explosionRadius: 1.2, desc: '追尾＆爆発', tier: 2 },
            chain: { name: 'チェイン', icon: '⛓️', cost: 100, damage: 15, range: 3, fireRate: 1000, color: '#00d2d3', isChain: true, chainCount: 3, chainRange: 2, desc: '3体に連鎖', tier: 2 },
            pierce: { name: 'ピアス', icon: '🗡️', cost: 85, damage: 18, range: 4, fireRate: 900, color: '#e91e63', bulletSpeed: 15, isPierce: true, pierceCount: 3, desc: '3体貫通', tier: 1 },
            fire: { name: 'ファイア', icon: '🔥', cost: 95, damage: 8, range: 2.5, fireRate: 600, color: '#ff5722', bulletSpeed: 10, isFire: true, burnDamage: 3, burnDuration: 3000, desc: '継続ダメージ', tier: 2 },
            minigun: { name: 'ミニガン', icon: '🔧', cost: 150, damage: 4, range: 2.8, fireRate: 100, color: '#607d8b', bulletSpeed: 12, desc: '超連射', tier: 3 },
            cannon: { name: 'キャノン', icon: '💣', cost: 140, damage: 80, range: 3.5, fireRate: 3000, color: '#795548', bulletSpeed: 6, isCannon: true, splashRadius: 1.5, desc: '大爆発', tier: 3 },
            tesla: { name: 'テスラ', icon: '⚡', cost: 160, damage: 20, range: 3.5, fireRate: 600, color: '#7c4dff', isChain: true, chainCount: 5, chainRange: 2.5, desc: '5体連鎖', tier: 3 },
            plasma: { name: 'プラズマ', icon: '🟣', cost: 170, damage: 30, range: 4, fireRate: 1200, color: '#e040fb', bulletSpeed: 8, isPierce: true, pierceCount: 5, isFire: true, burnDamage: 5, burnDuration: 2000, desc: '貫通+燃焼', tier: 3 },
            railgun: { name: 'レールガン', icon: '🔷', cost: 200, damage: 100, range: 8, fireRate: 3500, color: '#00e5ff', isLaser: true, desc: '最強貫通', tier: 4 },
            flamethrower: { name: '火炎放射', icon: '🌋', cost: 110, damage: 3, range: 2, fireRate: 50, color: '#ff6f00', isFlame: true, desc: '常時範囲攻撃', tier: 2 },
            mortar: { name: 'モーター', icon: '🎆', cost: 180, damage: 60, range: 5, fireRate: 2500, color: '#8d6e63', bulletSpeed: 3, isMortar: true, splashRadius: 2, desc: '超広範囲', tier: 3 },
            blackhole: { name: 'ブラックホール', icon: '🕳️', cost: 250, damage: 5, range: 3, fireRate: 100, color: '#4a148c', isBlackhole: true, pullStrength: 0.5, desc: '敵を引き寄せ', tier: 4 }
        };

        // 武器解放順（弱い順）
        const WEAPON_UNLOCK_ORDER = [
            'rapid',        // Wave 1後: tier1
            'shotgun',      // Wave 2後: tier1
            'freeze',       // Wave 3後: tier1
            'pierce',       // Wave 4後: tier1
            'sniper',       // Wave 5後: tier2
            'fire',         // Wave 6後: tier2
            'chain',        // Wave 7後: tier2
            'flamethrower', // Wave 8後: tier2
            'laser',        // Wave 9後: tier2
            'missile',      // Wave 10後: tier2
            'minigun',      // Wave 11後: tier3
            'cannon',       // Wave 12後: tier3
            'tesla',        // Wave 13後: tier3
            'plasma',       // Wave 14後: tier3
            'mortar'        // Wave 15後: tier3（最後の報酬）
        ];

        // 敵タイプ（10種類）- バランス調整済み
        const ENEMY_TYPES = {
            normal: { hp: 20, speed: 0.8, reward: 15, color: '#ff6b6b', size: 0.3 },
            fast: { hp: 15, speed: 1.8, reward: 20, color: '#ffd93d', size: 0.25 },
            tank: { hp: 80, speed: 0.4, reward: 40, color: '#6bcb77', size: 0.4 },
            boss: { hp: 250, speed: 0.25, reward: 150, color: '#9b59b6', size: 0.55 },
            swarm: { hp: 8, speed: 1.5, reward: 8, color: '#e67e22', size: 0.18 },
            armored: { hp: 120, speed: 0.35, reward: 60, color: '#546e7a', size: 0.45, armor: 3 },
            healer: { hp: 40, speed: 0.7, reward: 50, color: '#4caf50', size: 0.3, isHealer: true, healAmount: 1, healRange: 2 },
            splitter: { hp: 35, speed: 0.9, reward: 25, color: '#ff7043', size: 0.35, splits: 2 },
            ghost: { hp: 30, speed: 1.3, reward: 30, color: 'rgba(200,200,255,0.6)', size: 0.3, isGhost: true },
            megaboss: { hp: 600, speed: 0.15, reward: 300, color: '#d500f9', size: 0.7, armor: 5 }
        };

        // 15ウェーブ（段階的に難易度UP）
        const WAVES = [
            { enemies: [{ type: 'normal', count: 5, interval: 1500 }] },
            { enemies: [{ type: 'normal', count: 8, interval: 1200 }, { type: 'fast', count: 3, interval: 1000 }] },
            { enemies: [{ type: 'normal', count: 6, interval: 1000 }, { type: 'swarm', count: 8, interval: 500 }] },
            { enemies: [{ type: 'tank', count: 3, interval: 2000 }, { type: 'normal', count: 8, interval: 1000 }] },
            { enemies: [{ type: 'fast', count: 10, interval: 600 }, { type: 'tank', count: 2, interval: 2500 }] },
            { enemies: [{ type: 'swarm', count: 20, interval: 300 }, { type: 'healer', count: 2, interval: 3000 }] },
            { enemies: [{ type: 'normal', count: 10, interval: 800 }, { type: 'splitter', count: 5, interval: 1500 }] },
            { enemies: [{ type: 'armored', count: 3, interval: 2500 }, { type: 'fast', count: 12, interval: 500 }] },
            { enemies: [{ type: 'ghost', count: 8, interval: 1000 }, { type: 'tank', count: 4, interval: 2000 }] },
            { enemies: [{ type: 'boss', count: 1, interval: 0 }, { type: 'normal', count: 15, interval: 800 }] },
            { enemies: [{ type: 'armored', count: 5, interval: 1800 }, { type: 'healer', count: 3, interval: 2500 }, { type: 'swarm', count: 15, interval: 400 }] },
            { enemies: [{ type: 'splitter', count: 8, interval: 1200 }, { type: 'ghost', count: 6, interval: 1500 }] },
            { enemies: [{ type: 'tank', count: 6, interval: 1500 }, { type: 'fast', count: 15, interval: 400 }, { type: 'boss', count: 1, interval: 5000 }] },
            { enemies: [{ type: 'armored', count: 8, interval: 1200 }, { type: 'healer', count: 4, interval: 2000 }, { type: 'ghost', count: 10, interval: 800 }] },
            { enemies: [{ type: 'megaboss', count: 1, interval: 0 }, { type: 'boss', count: 2, interval: 4000 }, { type: 'armored', count: 5, interval: 2000 }] }
        ];

        let canvas, ctx, gameState;

        function initState() {
            return {
                gold: 150, lives: 20, wave: 0, kills: 0,
                selectedTower: null, towers: [], enemies: [], bullets: [], particles: [],
                lasers: [], chains: [], flames: [],
                waveInProgress: false, gameOver: false, spawnQueue: [], selectedPlacedTower: null,
                shake: 0,
                unlockedWeapons: ['basic'],  // 最初はベーシックのみ
                availableForUnlock: [],       // まだ解放されていない武器プール
                pendingWeaponChoice: null     // 選択待ちの武器候補
            };
        }

        function pointToLineDistance(px, py, x1, y1, x2, y2) {
            const A = px - x1, B = py - y1, C = x2 - x1, D = y2 - y1;
            const dot = A * C + B * D;
            const lenSq = C * C + D * D;
            let param = lenSq !== 0 ? dot / lenSq : -1;
            param = Math.max(0, Math.min(1, param));
            const xx = x1 + param * C, yy = y1 + param * D;
            return Math.sqrt((px - xx) ** 2 + (py - yy) ** 2);
        }

        function resizeCanvas() {
            const container = document.getElementById('game-container');
            const maxW = container.clientWidth;
            const maxH = container.clientHeight;
            const gw = Math.floor(maxW / CONFIG.COLS);
            const gh = Math.floor(maxH / CONFIG.ROWS);
            GRID_SIZE = Math.min(gw, gh, 40);
            canvas.width = CONFIG.COLS * GRID_SIZE;
            canvas.height = CONFIG.ROWS * GRID_SIZE;
        }

        function init() {
            gameState = initState();
            canvas = document.getElementById('game-canvas');
            ctx = canvas.getContext('2d');

            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);

            canvas.addEventListener('click', e => {
                const r = canvas.getBoundingClientRect();
                const scaleX = canvas.width / r.width;
                const scaleY = canvas.height / r.height;
                handlePlacement((e.clientX - r.left) * scaleX, (e.clientY - r.top) * scaleY);
            });

            canvas.addEventListener('touchstart', e => {
                e.preventDefault();
                const r = canvas.getBoundingClientRect();
                const t = e.touches[0];
                const scaleX = canvas.width / r.width;
                const scaleY = canvas.height / r.height;
                handlePlacement((t.clientX - r.left) * scaleX, (t.clientY - r.top) * scaleY);
            });

            document.getElementById('start-btn').addEventListener('click', startWave);
            document.getElementById('upgrade-btn').addEventListener('click', upgradeTower);
            document.getElementById('sell-btn').addEventListener('click', sellTower);
            document.getElementById('close-panel').addEventListener('click', closeUpgradePanel);
            document.getElementById('restart-btn').addEventListener('click', restartGame);
            document.getElementById('start-game-btn').addEventListener('click', () => {
                document.getElementById('tutorial').style.display = 'none';
            });

            updateTowerPanel();
            updateUI();
            requestAnimationFrame(gameLoop);
        }

        function updateTowerPanel() {
            const panel = document.getElementById('tower-panel');
            panel.innerHTML = '';
            gameState.unlockedWeapons.forEach(wKey => {
                const w = ALL_WEAPONS[wKey];
                const btn = document.createElement('div');
                btn.className = 'tower-btn';
                btn.dataset.tower = wKey;
                btn.innerHTML = `<span class="tower-icon">${w.icon}</span><span class="tower-name">${w.name}</span><span class="tower-cost">💰${w.cost}</span>`;
                btn.addEventListener('click', () => selectTower(wKey));
                panel.appendChild(btn);
            });
            updateUI();
        }

        function selectTower(type) {
            document.querySelectorAll('.tower-btn').forEach(btn => btn.classList.remove('selected'));
            gameState.selectedTower = gameState.selectedTower === type ? null : type;
            if (gameState.selectedTower) {
                document.querySelector(`[data-tower="${type}"]`)?.classList.add('selected');
            }
            closeUpgradePanel();
        }

        function handlePlacement(x, y) {
            const col = Math.floor(x / GRID_SIZE);
            const row = Math.floor(y / GRID_SIZE);

            const existing = gameState.towers.find(t => t.col === col && t.row === row);
            if (existing) { showUpgradePanel(existing); return; }

            closeUpgradePanel();
            if (!gameState.selectedTower) return;

            const tt = ALL_WEAPONS[gameState.selectedTower];
            if (gameState.gold < tt.cost || row < CONFIG.TOWER_ZONE_START) return;

            gameState.towers.push({
                type: gameState.selectedTower, col, row,
                x: col * GRID_SIZE + GRID_SIZE / 2,
                y: row * GRID_SIZE + GRID_SIZE / 2,
                level: 1, lastFire: 0, ...tt
            });
            gameState.gold -= tt.cost;
            updateUI();
            gameState.selectedTower = null;
            document.querySelectorAll('.tower-btn').forEach(btn => btn.classList.remove('selected'));
        }

        function showUpgradePanel(tower) {
            gameState.selectedPlacedTower = tower;
            const panel = document.getElementById('upgrade-panel');
            const uc = Math.floor(tower.cost * tower.level * 0.75);
            const sp = Math.floor(tower.cost * tower.level * 0.5);

            document.getElementById('upgrade-title').textContent = `${tower.name} Lv.${tower.level}`;
            document.getElementById('upgrade-info').innerHTML = `攻撃:${tower.damage} 射程:${tower.range.toFixed(1)}`;
            document.getElementById('upgrade-btn').textContent = `強化(💰${uc})`;
            document.getElementById('upgrade-btn').disabled = gameState.gold < uc || tower.level >= 5;
            document.getElementById('sell-btn').textContent = `売却(💰${sp})`;

            panel.style.display = 'block';
            panel.style.left = Math.min(tower.x, canvas.width - 140) + 'px';
            panel.style.top = Math.min(tower.y, canvas.height - 120) + 'px';
        }

        function closeUpgradePanel() {
            document.getElementById('upgrade-panel').style.display = 'none';
            gameState.selectedPlacedTower = null;
        }

        function upgradeTower() {
            const t = gameState.selectedPlacedTower;
            if (!t || t.level >= 5) return;
            const uc = Math.floor(t.cost * t.level * 0.75);
            if (gameState.gold < uc) return;

            gameState.gold -= uc;
            t.level++;
            t.damage = Math.floor(t.damage * 1.4);
            t.range += 0.3;
            t.fireRate = Math.floor(t.fireRate * 0.9);
            updateUI();
            showUpgradePanel(t);
        }

        function sellTower() {
            const t = gameState.selectedPlacedTower;
            if (!t) return;
            gameState.gold += Math.floor(t.cost * t.level * 0.5);
            const i = gameState.towers.indexOf(t);
            if (i > -1) gameState.towers.splice(i, 1);
            updateUI();
            closeUpgradePanel();
        }

        function getNextWeaponForWave(wave) {
            // ウェーブ番号に対応する武器を1つ返す（弱い順）
            const idx = wave - 1; // Wave 1クリア → index 0
            if (idx >= 0 && idx < WEAPON_UNLOCK_ORDER.length) {
                const weapon = WEAPON_UNLOCK_ORDER[idx];
                if (!gameState.unlockedWeapons.includes(weapon)) {
                    return weapon;
                }
            }
            return null;
        }

        function showWeaponSelectUI(weaponKey) {
            const modal = document.getElementById('weapon-select');
            const choicesDiv = document.getElementById('weapon-choices');
            const discardSection = document.getElementById('discard-section');
            const discardChoices = document.getElementById('discard-choices');
            const inventoryInfo = document.getElementById('inventory-info');

            const w = ALL_WEAPONS[weaponKey];
            choicesDiv.innerHTML = '';

            // 1個の武器を表示
            const div = document.createElement('div');
            div.className = 'weapon-choice';
            div.style.padding = '12px 20px';
            div.innerHTML = `<div class="icon" style="font-size:28px">${w.icon}</div><div class="name" style="font-size:12px">${w.name}</div><div style="font-size:9px;color:#aaa;margin-top:3px">${w.desc}</div>`;
            div.onclick = () => selectNewWeapon(weaponKey);
            choicesDiv.appendChild(div);

            // パスボタン
            const skipBtn = document.createElement('div');
            skipBtn.className = 'weapon-choice';
            skipBtn.style.borderColor = '#666';
            skipBtn.innerHTML = `<div class="icon">⏭️</div><div class="name">パス</div>`;
            skipBtn.onclick = () => closeWeaponSelect();
            choicesDiv.appendChild(skipBtn);

            inventoryInfo.textContent = `現在の武器: ${gameState.unlockedWeapons.length}/${MAX_WEAPONS}`;
            gameState.pendingWeaponChoice = weaponKey;

            // 武器が6個の場合、捨てる選択を表示
            if (gameState.unlockedWeapons.length >= MAX_WEAPONS) {
                discardSection.style.display = 'block';
                discardChoices.innerHTML = '';
                gameState.unlockedWeapons.forEach(wKey => {
                    if (wKey === 'basic') return; // ベーシックは捨てられない
                    const w = ALL_WEAPONS[wKey];
                    const btn = document.createElement('div');
                    btn.className = 'discard-btn';
                    btn.innerHTML = `${w.icon} ${w.name}`;
                    btn.onclick = () => discardWeapon(wKey);
                    discardChoices.appendChild(btn);
                });
                inventoryInfo.textContent = '⚠️ 武器がいっぱい！先に1つ捨ててください';
                inventoryInfo.style.color = '#ff6b6b';
            } else {
                discardSection.style.display = 'none';
                inventoryInfo.style.color = '#aaa';
            }

            modal.style.display = 'block';
        }

        function discardWeapon(wKey) {
            const idx = gameState.unlockedWeapons.indexOf(wKey);
            if (idx > -1) {
                gameState.unlockedWeapons.splice(idx, 1);
                updateTowerPanel();
                // 再度UIを更新
                if (gameState.pendingWeaponChoice) {
                    showWeaponSelectUI(gameState.pendingWeaponChoice);
                }
            }
        }

        function selectNewWeapon(wKey) {
            if (gameState.unlockedWeapons.length >= MAX_WEAPONS) {
                return; // まず捨てる必要がある
            }
            gameState.unlockedWeapons.push(wKey);
            updateTowerPanel();
            closeWeaponSelect();
        }

        function closeWeaponSelect() {
            document.getElementById('weapon-select').style.display = 'none';
            gameState.pendingWeaponChoice = null;
        }

        function startWave() {
            if (gameState.waveInProgress || gameState.gameOver || gameState.wave >= WAVES.length) return;

            gameState.waveInProgress = true;
            gameState.wave++;
            updateUI();

            document.getElementById('start-btn').disabled = true;
            document.getElementById('start-btn').textContent = '⚔️ 戦闘中';

            const wd = WAVES[gameState.wave - 1];
            gameState.spawnQueue = [];
            let delay = 500;

            // 敵のHPをウェーブに応じてスケール（緩やか）
            const hpScale = 1 + (gameState.wave - 1) * 0.08;

            wd.enemies.forEach(g => {
                for (let i = 0; i < g.count; i++) {
                    gameState.spawnQueue.push({
                        type: g.type,
                        spawnTime: Date.now() + delay,
                        hpScale: hpScale
                    });
                    delay += g.interval;
                }
            });
        }

        function spawnEnemy(type, hpScale = 1) {
            const et = ENEMY_TYPES[type];
            const col = Math.floor(Math.random() * CONFIG.COLS);
            const scaledHp = Math.floor(et.hp * hpScale);
            gameState.enemies.push({
                x: col * GRID_SIZE + GRID_SIZE / 2,
                y: -GRID_SIZE / 2,
                type: type,
                hp: scaledHp, maxHp: scaledHp,
                speed: et.speed, baseSpeed: et.speed,
                reward: Math.floor(et.reward * (1 + (hpScale - 1) * 0.5)),
                color: et.color,
                size: et.size * GRID_SIZE,
                slowUntil: 0,
                burnUntil: 0, burnDamage: 0,
                armor: et.armor || 0,
                isHealer: et.isHealer, healAmount: et.healAmount, healRange: et.healRange,
                splits: et.splits,
                isGhost: et.isGhost,
                lastHeal: 0
            });
        }

        function gameLoop() {
            if (gameState.gameOver) { render(); return; }
            update();
            render();
            requestAnimationFrame(gameLoop);
        }

        function update() {
            const now = Date.now();

            // スポーン
            gameState.spawnQueue = gameState.spawnQueue.filter(s => {
                if (now >= s.spawnTime) {
                    spawnEnemy(s.type, s.hpScale);
                    return false;
                }
                return true;
            });

            // ウェーブ終了チェック
            if (gameState.waveInProgress && gameState.spawnQueue.length === 0 && gameState.enemies.length === 0) {
                gameState.waveInProgress = false;
                document.getElementById('start-btn').disabled = false;

                if (gameState.wave >= WAVES.length) {
                    endGame(true);
                } else {
                    document.getElementById('start-btn').textContent = `🚀 Wave ${gameState.wave + 1}`;
                    gameState.gold += 20 + gameState.wave * 10;
                    updateUI();

                    // 武器解放（弱い順に1個ずつ）
                    const nextWeapon = getNextWeaponForWave(gameState.wave);
                    if (nextWeapon) {
                        setTimeout(() => showWeaponSelectUI(nextWeapon), 500);
                    }
                }
            }

            // 敵の更新
            gameState.enemies.forEach(e => {
                // スロー
                e.speed = now < e.slowUntil ? e.baseSpeed * 0.4 : e.baseSpeed;
                e.y += e.speed;

                // 燃焼ダメージ
                if (now < e.burnUntil && e.burnDamage > 0) {
                    e.hp -= e.burnDamage * 0.016; // 60FPS想定
                }

                // ヒーラー能力
                if (e.isHealer && now - e.lastHeal > 500) {
                    e.lastHeal = now;
                    gameState.enemies.forEach(other => {
                        if (other === e) return;
                        const d = Math.sqrt((other.x - e.x) ** 2 + (other.y - e.y) ** 2) / GRID_SIZE;
                        if (d < e.healRange) {
                            other.hp = Math.min(other.maxHp, other.hp + e.healAmount);
                        }
                    });
                }

                if (e.y >= canvas.height) {
                    gameState.lives--;
                    e.hp = 0;
                    updateUI();
                    if (gameState.lives <= 0) endGame(false);
                }
            });

            // 死亡処理（分裂含む）
            gameState.enemies = gameState.enemies.filter(e => {
                if (e.hp <= 0) {
                    // 分裂
                    if (e.splits && e.splits > 0) {
                        for (let i = 0; i < e.splits; i++) {
                            const child = {
                                x: e.x + (Math.random() - 0.5) * 20,
                                y: e.y,
                                type: 'swarm',
                                hp: 15, maxHp: 15,
                                speed: 1.5, baseSpeed: 1.5,
                                reward: 5,
                                color: '#ff7043',
                                size: GRID_SIZE * 0.18,
                                slowUntil: 0, burnUntil: 0, burnDamage: 0, armor: 0
                            };
                            gameState.enemies.push(child);
                        }
                    }
                    return false;
                }
                return true;
            });

            // タワー攻撃
            gameState.towers.forEach(t => {
                if (now - t.lastFire < t.fireRate) return;

                // ゴースト無視（一部の武器は当たる）
                let validEnemies = gameState.enemies;
                if (!t.isLaser && !t.isChain && !t.isFlame) {
                    validEnemies = gameState.enemies.filter(e => !e.isGhost || Math.random() < 0.3);
                }

                let target = null, minD = Infinity;
                validEnemies.forEach(e => {
                    const d = Math.sqrt((e.x - t.x) ** 2 + (e.y - t.y) ** 2) / GRID_SIZE;
                    if (d <= t.range && d < minD) { minD = d; target = e; }
                });

                if (!target) return;
                t.lastFire = now;

                // ブラックホール
                if (t.isBlackhole) {
                    gameState.enemies.forEach(e => {
                        const d = Math.sqrt((e.x - t.x) ** 2 + (e.y - t.y) ** 2) / GRID_SIZE;
                        if (d <= t.range) {
                            const dx = t.x - e.x, dy = t.y - e.y;
                            const dist = Math.sqrt(dx*dx + dy*dy);
                            if (dist > 5) {
                                e.x += (dx / dist) * t.pullStrength * GRID_SIZE * 0.1;
                                e.y += (dy / dist) * t.pullStrength * GRID_SIZE * 0.1;
                            }
                            dealDamage(e, t.damage);
                        }
                    });
                    // エフェクト
                    if (Math.random() < 0.3) {
                        gameState.particles.push({
                            x: t.x + (Math.random()-0.5) * t.range * GRID_SIZE,
                            y: t.y + (Math.random()-0.5) * t.range * GRID_SIZE,
                            vx: 0, vy: 0, color: '#7c4dff', size: 3, life: 20, type: 'spark'
                        });
                    }
                    return;
                }

                // 火炎放射
                if (t.isFlame) {
                    gameState.enemies.forEach(e => {
                        const d = Math.sqrt((e.x - t.x) ** 2 + (e.y - t.y) ** 2) / GRID_SIZE;
                        if (d <= t.range) {
                            dealDamage(e, t.damage);
                            e.burnUntil = now + 1000;
                            e.burnDamage = 2;
                        }
                    });
                    // 炎エフェクト
                    for (let i = 0; i < 3; i++) {
                        const angle = Math.random() * Math.PI * 2;
                        const dist = Math.random() * t.range * GRID_SIZE;
                        gameState.particles.push({
                            x: t.x + Math.cos(angle) * dist,
                            y: t.y + Math.sin(angle) * dist,
                            vx: (Math.random()-0.5)*2, vy: -1 - Math.random(),
                            color: Math.random() < 0.5 ? '#ff6600' : '#ffcc00',
                            size: 4 + Math.random() * 4, life: 15, type: 'explosion'
                        });
                    }
                    return;
                }

                // レーザー
                if (t.isLaser) {
                    const angle = Math.atan2(target.y - t.y, target.x - t.x);
                    const laserEnd = { x: t.x + Math.cos(angle) * t.range * GRID_SIZE, y: t.y + Math.sin(angle) * t.range * GRID_SIZE };
                    gameState.enemies.forEach(e => {
                        const dist = pointToLineDistance(e.x, e.y, t.x, t.y, laserEnd.x, laserEnd.y);
                        if (dist < e.size + 5) {
                            dealDamage(e, t.damage);
                        }
                    });
                    gameState.lasers.push({ x1: t.x, y1: t.y, x2: laserEnd.x, y2: laserEnd.y, color: t.color, life: 8 });
                    return;
                }

                // チェイン
                if (t.isChain) {
                    let chainTargets = [target];
                    let lastTarget = target;
                    dealDamage(target, t.damage);
                    for (let i = 1; i < t.chainCount; i++) {
                        let nextTarget = null, nextDist = Infinity;
                        gameState.enemies.forEach(e => {
                            if (chainTargets.includes(e) || e.hp <= 0) return;
                            const d = Math.sqrt((e.x - lastTarget.x) ** 2 + (e.y - lastTarget.y) ** 2) / GRID_SIZE;
                            if (d <= t.chainRange && d < nextDist) { nextDist = d; nextTarget = e; }
                        });
                        if (nextTarget) {
                            gameState.chains.push({ x1: lastTarget.x, y1: lastTarget.y, x2: nextTarget.x, y2: nextTarget.y, color: t.color, life: 12 });
                            dealDamage(nextTarget, t.damage * (1 - i * 0.15));
                            chainTargets.push(nextTarget);
                            lastTarget = nextTarget;
                        }
                    }
                    gameState.chains.push({ x1: t.x, y1: t.y, x2: target.x, y2: target.y, color: t.color, life: 12 });
                    return;
                }

                // 散弾銃
                if (t.shotCount) {
                    const baseAngle = Math.atan2(target.y - t.y, target.x - t.x);
                    for (let i = 0; i < t.shotCount; i++) {
                        const angle = baseAngle + (i - (t.shotCount - 1) / 2) * t.spread;
                        gameState.bullets.push({
                            x: t.x, y: t.y,
                            vx: Math.cos(angle) * t.bulletSpeed,
                            vy: Math.sin(angle) * t.bulletSpeed,
                            damage: t.damage, speed: t.bulletSpeed,
                            color: t.color, isShotgun: true, range: t.range * GRID_SIZE,
                            startX: t.x, startY: t.y
                        });
                    }
                    return;
                }

                // ミサイル
                if (t.isMissile) {
                    const angle = Math.atan2(target.y - t.y, target.x - t.x);
                    gameState.bullets.push({
                        x: t.x, y: t.y, target,
                        vx: Math.cos(angle) * 2, vy: Math.sin(angle) * 2,
                        damage: t.damage, speed: t.bulletSpeed || 4,
                        color: t.color, isMissile: true, explosionRadius: t.explosionRadius
                    });
                    return;
                }

                // キャノン
                if (t.isCannon) {
                    gameState.bullets.push({
                        x: t.x, y: t.y, target,
                        vx: 0, vy: 0,
                        damage: t.damage, speed: t.bulletSpeed || 6,
                        color: t.color, isCannon: true, splashRadius: t.splashRadius
                    });
                    return;
                }

                // モーター
                if (t.isMortar) {
                    gameState.bullets.push({
                        startX: t.x, startY: t.y,
                        targetX: target.x, targetY: target.y,
                        damage: t.damage, color: t.color,
                        isMortar: true, splashRadius: t.splashRadius || 2,
                        progress: 0, duration: 40
                    });
                    return;
                }

                // 貫通弾
                if (t.isPierce) {
                    const angle = Math.atan2(target.y - t.y, target.x - t.x);
                    gameState.bullets.push({
                        x: t.x, y: t.y,
                        vx: Math.cos(angle) * t.bulletSpeed,
                        vy: Math.sin(angle) * t.bulletSpeed,
                        damage: t.damage, speed: t.bulletSpeed,
                        color: t.color, isPierce: true, pierceCount: t.pierceCount,
                        hitEnemies: [],
                        isFire: t.isFire, burnDamage: t.burnDamage, burnDuration: t.burnDuration
                    });
                    return;
                }

                // フリーズ弾
                if (t.isFreeze) {
                    gameState.bullets.push({
                        x: t.x, y: t.y, target,
                        damage: t.damage, speed: t.bulletSpeed || 8,
                        color: t.color, isFreeze: true, slowDuration: t.slowDuration
                    });
                    return;
                }

                // ファイア弾
                if (t.isFire) {
                    gameState.bullets.push({
                        x: t.x, y: t.y, target,
                        damage: t.damage, speed: t.bulletSpeed || 10,
                        color: t.color, isFire: true, burnDamage: t.burnDamage, burnDuration: t.burnDuration
                    });
                    return;
                }

                // 通常弾
                gameState.bullets.push({
                    x: t.x, y: t.y, target,
                    damage: t.damage, speed: t.bulletSpeed || 8,
                    color: t.color
                });
            });

            // 弾移動
            gameState.bullets = gameState.bullets.filter(b => {
                // モーター（放物線）
                if (b.isMortar) {
                    b.progress++;
                    const t = b.progress / b.duration;
                    if (t >= 1) {
                        // 着弾
                        gameState.enemies.forEach(e => {
                            const d = Math.sqrt((e.x - b.targetX) ** 2 + (e.y - b.targetY) ** 2) / GRID_SIZE;
                            if (d <= b.splashRadius) {
                                dealDamage(e, b.damage * (1 - d / b.splashRadius * 0.5));
                            }
                        });
                        createExplosion(b.targetX, b.targetY, b.color);
                        return false;
                    }
                    return true;
                }

                // 散弾銃
                if (b.isShotgun) {
                    b.x += b.vx; b.y += b.vy;
                    const traveled = Math.sqrt((b.x - b.startX) ** 2 + (b.y - b.startY) ** 2);
                    if (traveled > b.range) return false;
                    for (let e of gameState.enemies) {
                        const d = Math.sqrt((e.x - b.x) ** 2 + (e.y - b.y) ** 2);
                        if (d < e.size + 5) {
                            dealDamage(e, b.damage);
                            return false;
                        }
                    }
                    return true;
                }

                // 貫通弾
                if (b.isPierce) {
                    b.x += b.vx; b.y += b.vy;
                    if (b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) return false;
                    for (let e of gameState.enemies) {
                        if (b.hitEnemies.includes(e)) continue;
                        const d = Math.sqrt((e.x - b.x) ** 2 + (e.y - b.y) ** 2);
                        if (d < e.size + 5) {
                            dealDamage(e, b.damage);
                            b.hitEnemies.push(e);
                            if (b.isFire) {
                                e.burnUntil = now + b.burnDuration;
                                e.burnDamage = b.burnDamage;
                            }
                            b.pierceCount--;
                            if (b.pierceCount <= 0) return false;
                        }
                    }
                    return true;
                }

                // ミサイル
                if (b.isMissile && b.target && b.target.hp > 0) {
                    const dx = b.target.x - b.x, dy = b.target.y - b.y;
                    const d = Math.sqrt(dx * dx + dy * dy);
                    if (d < 15) {
                        gameState.enemies.forEach(e => {
                            const ed = Math.sqrt((e.x - b.x) ** 2 + (e.y - b.y) ** 2) / GRID_SIZE;
                            if (ed <= b.explosionRadius) {
                                dealDamage(e, b.damage * (1 - ed / b.explosionRadius * 0.3));
                            }
                        });
                        createExplosion(b.x, b.y, b.color);
                        return false;
                    }
                    const angle = Math.atan2(dy, dx);
                    b.vx = b.vx * 0.9 + Math.cos(angle) * b.speed * 0.3;
                    b.vy = b.vy * 0.9 + Math.sin(angle) * b.speed * 0.3;
                    b.x += b.vx; b.y += b.vy;
                    if (Math.random() < 0.5) {
                        gameState.particles.push({
                            x: b.x, y: b.y, vx: (Math.random()-0.5)*2, vy: (Math.random()-0.5)*2,
                            color: '#888', size: 3, life: 10, type: 'smoke'
                        });
                    }
                    return true;
                }

                // キャノン
                if (b.isCannon) {
                    if (!b.target || b.target.hp <= 0) return false;
                    const dx = b.target.x - b.x, dy = b.target.y - b.y;
                    const d = Math.sqrt(dx * dx + dy * dy);
                    if (d < 15) {
                        gameState.enemies.forEach(e => {
                            const ed = Math.sqrt((e.x - b.x) ** 2 + (e.y - b.y) ** 2) / GRID_SIZE;
                            if (ed <= b.splashRadius) {
                                dealDamage(e, b.damage * (1 - ed / b.splashRadius * 0.4));
                            }
                        });
                        createExplosion(b.x, b.y, b.color);
                        return false;
                    }
                    b.x += dx / d * b.speed;
                    b.y += dy / d * b.speed;
                    return true;
                }

                // フリーズ
                if (b.isFreeze) {
                    if (!b.target || b.target.hp <= 0) return false;
                    const dx = b.target.x - b.x, dy = b.target.y - b.y;
                    const d = Math.sqrt(dx * dx + dy * dy);
                    if (d < 10) {
                        dealDamage(b.target, b.damage);
                        b.target.slowUntil = now + b.slowDuration;
                        for (let i = 0; i < 8; i++) {
                            gameState.particles.push({
                                x: b.target.x, y: b.target.y,
                                vx: (Math.random()-0.5)*4, vy: (Math.random()-0.5)*4,
                                color: '#00ffff', size: 3, life: 15, type: 'spark'
                            });
                        }
                        return false;
                    }
                    b.x += dx / d * b.speed;
                    b.y += dy / d * b.speed;
                    return true;
                }

                // ファイア
                if (b.isFire && !b.isPierce) {
                    if (!b.target || b.target.hp <= 0) return false;
                    const dx = b.target.x - b.x, dy = b.target.y - b.y;
                    const d = Math.sqrt(dx * dx + dy * dy);
                    if (d < 10) {
                        dealDamage(b.target, b.damage);
                        b.target.burnUntil = now + b.burnDuration;
                        b.target.burnDamage = b.burnDamage;
                        return false;
                    }
                    b.x += dx / d * b.speed;
                    b.y += dy / d * b.speed;
                    return true;
                }

                // 通常弾
                if (!b.target || b.target.hp <= 0) return false;
                const dx = b.target.x - b.x, dy = b.target.y - b.y;
                const d = Math.sqrt(dx * dx + dy * dy);
                if (d < 10) {
                    dealDamage(b.target, b.damage);
                    return false;
                }
                b.vx = dx / d * b.speed;
                b.vy = dy / d * b.speed;
                b.x += b.vx;
                b.y += b.vy;
                return true;
            });

            // パーティクル
            gameState.particles = gameState.particles.filter(p => {
                p.x += p.vx; p.y += p.vy;
                p.life--;
                if (p.type !== 'smoke' && p.type !== 'ring' && p.type !== 'flash') p.vy += 0.1;
                return p.life > 0;
            });

            // レーザー減衰
            gameState.lasers = gameState.lasers.filter(l => { l.life--; return l.life > 0; });
            // チェイン減衰
            gameState.chains = gameState.chains.filter(c => { c.life--; return c.life > 0; });
        }

        function dealDamage(e, dmg) {
            // アーマー軽減
            const actualDmg = Math.max(1, dmg - e.armor);
            e.hp -= actualDmg;

            for (let i = 0; i < 3; i++) {
                gameState.particles.push({
                    x: e.x + (Math.random() - 0.5) * e.size,
                    y: e.y + (Math.random() - 0.5) * e.size,
                    vx: (Math.random() - 0.5) * 3,
                    vy: (Math.random() - 0.5) * 3,
                    color: '#fff', size: 2, life: 8, type: 'spark'
                });
            }

            if (e.hp <= 0) {
                gameState.gold += e.reward;
                gameState.kills++;
                updateUI();
                gameState.shake = 5;

                for (let i = 0; i < 15; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = 2 + Math.random() * 4;
                    gameState.particles.push({
                        x: e.x, y: e.y,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed,
                        color: e.color,
                        size: 3 + Math.random() * 4,
                        life: 18 + Math.random() * 12,
                        type: 'explosion'
                    });
                }

                for (let i = 0; i < 6; i++) {
                    gameState.particles.push({
                        x: e.x, y: e.y,
                        vx: (Math.random() - 0.5) * 6,
                        vy: (Math.random() - 0.5) * 6,
                        color: '#fff', size: 2, life: 10, type: 'spark'
                    });
                }

                gameState.particles.push({
                    x: e.x, y: e.y, vx: 0, vy: 0,
                    color: e.color, size: 5, life: 15,
                    type: 'ring', maxSize: e.size * 2.5
                });
            }
        }

        function createExplosion(x, y, color) {
            gameState.shake = 8;
            for (let i = 0; i < 25; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 3 + Math.random() * 5;
                gameState.particles.push({
                    x, y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    color: i % 3 === 0 ? '#ff0' : color,
                    size: 4 + Math.random() * 5,
                    life: 22 + Math.random() * 12,
                    type: 'explosion'
                });
            }
            gameState.particles.push({ x, y, vx: 0, vy: 0, color: '#fff', size: GRID_SIZE, life: 8, type: 'flash' });
            for (let i = 0; i < 2; i++) {
                gameState.particles.push({
                    x, y, vx: 0, vy: 0,
                    color: i === 0 ? color : '#ff0',
                    size: 5, life: 18 - i * 5,
                    type: 'ring', maxSize: GRID_SIZE * (1.8 + i)
                });
            }
        }

        function render() {
            ctx.save();
            if (gameState.shake > 0) {
                ctx.translate(
                    (Math.random() - 0.5) * gameState.shake * 2,
                    (Math.random() - 0.5) * gameState.shake * 2
                );
                gameState.shake *= 0.8;
                if (gameState.shake < 0.5) gameState.shake = 0;
            }

            ctx.fillStyle = '#0f0f23';
            ctx.fillRect(-10, -10, canvas.width + 20, canvas.height + 20);

            // グリッド
            ctx.strokeStyle = '#1a1a3a';
            ctx.lineWidth = 1;
            for (let x = 0; x <= CONFIG.COLS; x++) {
                ctx.beginPath();
                ctx.moveTo(x * GRID_SIZE, 0);
                ctx.lineTo(x * GRID_SIZE, canvas.height);
                ctx.stroke();
            }
            for (let y = 0; y <= CONFIG.ROWS; y++) {
                ctx.beginPath();
                ctx.moveTo(0, y * GRID_SIZE);
                ctx.lineTo(canvas.width, y * GRID_SIZE);
                ctx.stroke();
            }

            // タワーゾーン
            ctx.fillStyle = 'rgba(74,158,255,0.12)';
            ctx.fillRect(0, CONFIG.TOWER_ZONE_START * GRID_SIZE, canvas.width, (CONFIG.ROWS - CONFIG.TOWER_ZONE_START) * GRID_SIZE);
            ctx.strokeStyle = '#4a9eff';
            ctx.lineWidth = 2;
            ctx.setLineDash([5, 5]);
            ctx.beginPath();
            ctx.moveTo(0, CONFIG.TOWER_ZONE_START * GRID_SIZE);
            ctx.lineTo(canvas.width, CONFIG.TOWER_ZONE_START * GRID_SIZE);
            ctx.stroke();
            ctx.setLineDash([]);

            // 選択中タワー射程
            if (gameState.selectedPlacedTower) {
                const t = gameState.selectedPlacedTower;
                ctx.beginPath();
                ctx.arc(t.x, t.y, t.range * GRID_SIZE, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(74,158,255,0.15)';
                ctx.fill();
            }

            // タワー
            gameState.towers.forEach(t => {
                const s = GRID_SIZE * 0.35;
                ctx.fillStyle = t.color;
                ctx.beginPath();
                ctx.moveTo(t.x, t.y - s);
                ctx.lineTo(t.x + s, t.y + s);
                ctx.lineTo(t.x - s, t.y + s);
                ctx.closePath();
                ctx.fill();

                if (t.level > 1) {
                    ctx.fillStyle = '#fff';
                    ctx.font = `bold ${GRID_SIZE * 0.25}px sans-serif`;
                    ctx.textAlign = 'center';
                    ctx.fillText(`${t.level}`, t.x, t.y + s + GRID_SIZE * 0.3);
                }
            });

            // 敵
            const now = Date.now();
            gameState.enemies.forEach(e => {
                const bw = e.size * 1.5, hp = e.hp / e.maxHp;
                ctx.fillStyle = '#333';
                ctx.fillRect(e.x - bw / 2, e.y - e.size - 6, bw, 3);
                ctx.fillStyle = hp > 0.5 ? '#4aff4a' : hp > 0.25 ? '#ffd700' : '#ff4a4a';
                ctx.fillRect(e.x - bw / 2, e.y - e.size - 6, bw * hp, 3);

                // 燃焼エフェクト
                if (now < e.burnUntil) {
                    ctx.shadowColor = '#ff4400';
                    ctx.shadowBlur = 10;
                }

                ctx.fillStyle = now < e.slowUntil ? '#4affff' : e.color;
                ctx.globalAlpha = e.isGhost ? 0.5 : 1;
                ctx.beginPath();
                ctx.arc(e.x, e.y, e.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;
                ctx.shadowBlur = 0;

                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(e.x - e.size * 0.3, e.y - e.size * 0.2, e.size * 0.15, 0, Math.PI * 2);
                ctx.arc(e.x + e.size * 0.3, e.y - e.size * 0.2, e.size * 0.15, 0, Math.PI * 2);
                ctx.fill();

                // ヒーラーマーク
                if (e.isHealer) {
                    ctx.fillStyle = '#fff';
                    ctx.font = `${e.size * 0.8}px sans-serif`;
                    ctx.textAlign = 'center';
                    ctx.fillText('+', e.x, e.y + e.size * 0.3);
                }
            });

            // レーザー
            gameState.lasers.forEach(l => {
                const alpha = l.life / 8;
                ctx.globalAlpha = alpha;
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 6;
                ctx.beginPath();
                ctx.moveTo(l.x1, l.y1);
                ctx.lineTo(l.x2, l.y2);
                ctx.stroke();
                ctx.strokeStyle = l.color;
                ctx.lineWidth = 3;
                ctx.shadowColor = l.color;
                ctx.shadowBlur = 15;
                ctx.stroke();
                ctx.shadowBlur = 0;
            });
            ctx.globalAlpha = 1;

            // チェイン
            gameState.chains.forEach(c => {
                const alpha = c.life / 12;
                ctx.globalAlpha = alpha;
                ctx.strokeStyle = c.color;
                ctx.lineWidth = 2;
                ctx.shadowColor = c.color;
                ctx.shadowBlur = 10;
                ctx.beginPath();
                const dx = c.x2 - c.x1, dy = c.y2 - c.y1;
                const dist = Math.sqrt(dx*dx + dy*dy);
                const segments = Math.max(3, Math.floor(dist / 15));
                ctx.moveTo(c.x1, c.y1);
                for (let i = 1; i < segments; i++) {
                    const t = i / segments;
                    const x = c.x1 + dx * t + (Math.random() - 0.5) * 15;
                    const y = c.y1 + dy * t + (Math.random() - 0.5) * 15;
                    ctx.lineTo(x, y);
                }
                ctx.lineTo(c.x2, c.y2);
                ctx.stroke();
                ctx.shadowBlur = 0;
            });
            ctx.globalAlpha = 1;

            // 弾
            gameState.bullets.forEach(b => {
                // モーター（放物線）
                if (b.isMortar) {
                    const prog = b.progress / b.duration;
                    const midX = (b.startX + b.targetX) / 2;
                    const midY = Math.min(b.startY, b.targetY) - 60;
                    const currX = (1-prog)*(1-prog)*b.startX + 2*(1-prog)*prog*midX + prog*prog*b.targetX;
                    const currY = (1-prog)*(1-prog)*b.startY + 2*(1-prog)*prog*midY + prog*prog*b.targetY;
                    ctx.fillStyle = b.color;
                    ctx.beginPath();
                    ctx.arc(currX, currY, 6, 0, Math.PI * 2);
                    ctx.fill();
                    return;
                }

                if (b.isMissile) {
                    ctx.fillStyle = b.color;
                    ctx.beginPath();
                    ctx.arc(b.x, b.y, 5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#ff0';
                    ctx.beginPath();
                    ctx.arc(b.x - (b.vx || 0) * 0.3, b.y - (b.vy || 0) * 0.3, 3, 0, Math.PI * 2);
                    ctx.fill();
                    return;
                }

                if (b.isCannon) {
                    ctx.fillStyle = b.color;
                    ctx.beginPath();
                    ctx.arc(b.x, b.y, 7, 0, Math.PI * 2);
                    ctx.fill();
                    return;
                }

                if (b.vx !== undefined) {
                    ctx.globalAlpha = 0.3;
                    ctx.beginPath();
                    ctx.arc(b.x - b.vx * 0.5, b.y - b.vy * 0.5, 4, 0, Math.PI * 2);
                    ctx.fillStyle = b.color;
                    ctx.fill();
                }
                ctx.globalAlpha = 1;
                ctx.beginPath();
                ctx.arc(b.x, b.y, 4, 0, Math.PI * 2);
                ctx.fillStyle = '#fff';
                ctx.fill();
                ctx.beginPath();
                ctx.arc(b.x, b.y, 3, 0, Math.PI * 2);
                ctx.fillStyle = b.color;
                ctx.fill();
            });

            // パーティクル
            gameState.particles.forEach(p => {
                const alpha = Math.min(1, p.life / 15);
                ctx.globalAlpha = alpha;

                if (p.type === 'ring') {
                    const progress = 1 - (p.life / 15);
                    const radius = p.size + (p.maxSize - p.size) * progress;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, radius, 0, Math.PI * 2);
                    ctx.strokeStyle = p.color;
                    ctx.lineWidth = 3 * alpha;
                    ctx.stroke();
                } else if (p.type === 'flash') {
                    const gradient = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size);
                    gradient.addColorStop(0, 'rgba(255,255,255,' + alpha + ')');
                    gradient.addColorStop(0.5, 'rgba(255,255,200,' + alpha * 0.5 + ')');
                    gradient.addColorStop(1, 'rgba(255,200,100,0)');
                    ctx.fillStyle = gradient;
                    ctx.fillRect(p.x - p.size, p.y - p.size, p.size * 2, p.size * 2);
                } else if (p.type === 'spark') {
                    ctx.fillStyle = p.color;
                    ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
                } else {
                    ctx.shadowColor = p.color;
                    ctx.shadowBlur = 8;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fillStyle = p.color;
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }
            });
            ctx.globalAlpha = 1;

            // ゴールライン
            ctx.strokeStyle = '#ff4a4a';
            ctx.lineWidth = 3;
            ctx.setLineDash([8, 4]);
            ctx.beginPath();
            ctx.moveTo(0, canvas.height - 3);
            ctx.lineTo(canvas.width, canvas.height - 3);
            ctx.stroke();
            ctx.setLineDash([]);

            ctx.restore();
        }

        function updateUI() {
            document.getElementById('gold').textContent = gameState.gold;
            document.getElementById('lives').textContent = gameState.lives;
            document.getElementById('wave').textContent = gameState.wave;
            document.getElementById('max-wave').textContent = WAVES.length;
            document.getElementById('kills').textContent = gameState.kills;

            document.querySelectorAll('.tower-btn').forEach(btn => {
                const wKey = btn.dataset.tower;
                if (wKey && ALL_WEAPONS[wKey]) {
                    btn.classList.toggle('disabled', gameState.gold < ALL_WEAPONS[wKey].cost);
                }
            });
        }

        function endGame(victory) {
            gameState.gameOver = true;
            document.getElementById('game-over').style.display = 'block';
            document.getElementById('result-text').textContent = victory ? '🎉 VICTORY!' : '💀 GAME OVER';
            document.getElementById('result-text').className = victory ? 'victory' : 'defeat';
            document.getElementById('result-detail').textContent = victory
                ? `全${WAVES.length}ウェーブクリア！ 撃破:${gameState.kills}`
                : `Wave ${gameState.wave} 敗北... 撃破:${gameState.kills}`;
        }

        function restartGame() {
            gameState = initState();
            document.getElementById('game-over').style.display = 'none';
            document.getElementById('weapon-select').style.display = 'none';
            document.getElementById('start-btn').disabled = false;
            document.getElementById('start-btn').textContent = '🚀 ウェーブ開始';
            updateTowerPanel();
            updateUI();
            requestAnimationFrame(gameLoop);
        }

        window.addEventListener('load', init);
    </script>
</body>
</html>
