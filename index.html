                if (now < e.burnUntil) {
                    ctx.shadowColor = '#ff4400';
                    ctx.shadowBlur = 15;
                }

                // スロー効果
                if (now < e.slowUntil) {
                    ctx.shadowColor = '#00ffff';
                    ctx.shadowBlur = 12;
                }

                // 敵本体
                ctx.globalAlpha = e.isGhost ? 0.5 : 1;

                // 外側のグロー
                ctx.shadowColor = e.color;
                ctx.shadowBlur = 5;

                // グラデーション塗り
                const bodyGrad = ctx.createRadialGradient(-e.size * 0.3, -e.size * 0.3, 0, 0, 0, e.size);
                const baseColor = now < e.slowUntil ? '#4affff' : e.color;
                bodyGrad.addColorStop(0, '#fff');
                bodyGrad.addColorStop(0.3, baseColor);
                bodyGrad.addColorStop(1, baseColor);
                ctx.fillStyle = bodyGrad;
                ctx.beginPath();
                ctx.arc(0, 0, e.size, 0, Math.PI * 2);
                ctx.fill();

                ctx.shadowBlur = 0;

                // 目
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(-e.size * 0.3, -e.size * 0.15, e.size * 0.2, 0, Math.PI * 2);
                ctx.arc(e.size * 0.3, -e.size * 0.15, e.size * 0.2, 0, Math.PI * 2);
                ctx.fill();

                // 瞳（下を向く）
                ctx.fillStyle = '#000';
                ctx.beginPath();
                ctx.arc(-e.size * 0.3, -e.size * 0.05, e.size * 0.1, 0, Math.PI * 2);
                ctx.arc(e.size * 0.3, -e.size * 0.05, e.size * 0.1, 0, Math.PI * 2);
                ctx.fill();

                ctx.globalAlpha = 1;
                ctx.restore();

                // ヒーラーマーク
                if (e.isHealer) {
                    ctx.fillStyle = '#fff';
                    ctx.strokeStyle = '#4caf50';
                    ctx.lineWidth = 2;
                    ctx.font = `bold ${e.size * 0.9}px sans-serif`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.strokeText('+', e.x, e.y);
                    ctx.fillText('+', e.x, e.y);
                }

                // アーマー表示
                if (e.armor > 0) {
                    ctx.fillStyle = 'rgba(100, 110, 130, 0.8)';
                    ctx.beginPath();
                    ctx.arc(e.x, e.y + e.size * 0.4, e.size * 0.25, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#fff';
                    ctx.font = `bold ${e.size * 0.3}px sans-serif`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('🛡', e.x, e.y + e.size * 0.4);
                }
            });

            // レーザー
            gameState.lasers.forEach(l => {
                const alpha = l.life / 8;
                ctx.globalAlpha = alpha;
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 6;
                ctx.beginPath();
                ctx.moveTo(l.x1, l.y1);
                ctx.lineTo(l.x2, l.y2);
                ctx.stroke();
                ctx.strokeStyle = l.color;
                ctx.lineWidth = 3;
                ctx.shadowColor = l.color;
                ctx.shadowBlur = 15;
                ctx.stroke();
                ctx.shadowBlur = 0;
            });
            ctx.globalAlpha = 1;

            // チェイン
            gameState.chains.forEach(c => {
                const alpha = c.life / 12;
                ctx.globalAlpha = alpha;
                ctx.strokeStyle = c.color;
                ctx.lineWidth = 2;
                ctx.shadowColor = c.color;
                ctx.shadowBlur = 10;
                ctx.beginPath();
                const dx = c.x2 - c.x1, dy = c.y2 - c.y1;
                const dist = Math.sqrt(dx*dx + dy*dy);
                const segments = Math.max(3, Math.floor(dist / 15));
                ctx.moveTo(c.x1, c.y1);
                for (let i = 1; i < segments; i++) {
                    const t = i / segments;
                    const x = c.x1 + dx * t + (Math.random() - 0.5) * 15;
                    const y = c.y1 + dy * t + (Math.random() - 0.5) * 15;
                    ctx.lineTo(x, y);
                }
                ctx.lineTo(c.x2, c.y2);
                ctx.stroke();
                ctx.shadowBlur = 0;
            });
            ctx.globalAlpha = 1;

            // 弾
            gameState.bullets.forEach(b => {
                // モーター（放物線）
                if (b.isMortar) {
                    const prog = b.progress / b.duration;
                    const midX = (b.startX + b.targetX) / 2;
                    const midY = Math.min(b.startY, b.targetY) - 60;
                    const currX = (1-prog)*(1-prog)*b.startX + 2*(1-prog)*prog*midX + prog*prog*b.targetX;
                    const currY = (1-prog)*(1-prog)*b.startY + 2*(1-prog)*prog*midY + prog*prog*b.targetY;
                    ctx.fillStyle = b.color;
                    ctx.beginPath();
                    ctx.arc(currX, currY, 6, 0, Math.PI * 2);
                    ctx.fill();
                    return;
                }

                if (b.isMissile) {
                    ctx.fillStyle = b.color;
                    ctx.beginPath();
                    ctx.arc(b.x, b.y, 5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#ff0';
                    ctx.beginPath();
                    ctx.arc(b.x - (b.vx || 0) * 0.3, b.y - (b.vy || 0) * 0.3, 3, 0, Math.PI * 2);
                    ctx.fill();
                    return;
                }

                if (b.isCannon) {
                    ctx.fillStyle = b.color;
                    ctx.beginPath();
                    ctx.arc(b.x, b.y, 7, 0, Math.PI * 2);
                    ctx.fill();
                    return;
                }

                if (b.vx !== undefined) {
                    ctx.globalAlpha = 0.3;
                    ctx.beginPath();
                    ctx.arc(b.x - b.vx * 0.5, b.y - b.vy * 0.5, 4, 0, Math.PI * 2);
                    ctx.fillStyle = b.color;
                    ctx.fill();
                }
                ctx.globalAlpha = 1;
                ctx.beginPath();
                ctx.arc(b.x, b.y, 4, 0, Math.PI * 2);
                ctx.fillStyle = '#fff';
                ctx.fill();
                ctx.beginPath();
                ctx.arc(b.x, b.y, 3, 0, Math.PI * 2);
                ctx.fillStyle = b.color;
                ctx.fill();
            });

            // パーティクル
            gameState.particles.forEach(p => {
                const alpha = Math.min(1, p.life / 15);
                ctx.globalAlpha = alpha;

                if (p.type === 'ring') {
                    const progress = 1 - (p.life / 15);
                    const radius = Math.max(1, p.size + (p.maxSize - p.size) * progress);
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, radius, 0, Math.PI * 2);
                    ctx.strokeStyle = p.color;
                    ctx.lineWidth = 3 * alpha;
                    ctx.stroke();
                } else if (p.type === 'flash') {
                    const size = Math.max(1, p.size);
                    const gradient = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, size);
                    gradient.addColorStop(0, 'rgba(255,255,255,' + alpha + ')');
                    gradient.addColorStop(0.5, 'rgba(255,255,200,' + alpha * 0.5 + ')');
                    gradient.addColorStop(1, 'rgba(255,200,100,0)');
                    ctx.fillStyle = gradient;
                    ctx.fillRect(p.x - size, p.y - size, size * 2, size * 2);
                } else if (p.type === 'spark') {
                    ctx.fillStyle = p.color;
                    ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
                } else {
                    const size = Math.max(1, p.size);
                    ctx.shadowColor = p.color;
                    ctx.shadowBlur = 8;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, size, 0, Math.PI * 2);
                    ctx.fillStyle = p.color;
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }
            });
            ctx.globalAlpha = 1;

            // ゴールライン
            ctx.strokeStyle = '#ff4a4a';
            ctx.lineWidth = 3;
            ctx.setLineDash([8, 4]);
            ctx.beginPath();
            ctx.moveTo(0, canvas.height - 3);
            ctx.lineTo(canvas.width, canvas.height - 3);
            ctx.stroke();
            ctx.setLineDash([]);

            ctx.restore();
        }

        function updateUI() {
            document.getElementById('gold').textContent = gameState.gold;
            document.getElementById('lives').textContent = gameState.lives;
            document.getElementById('wave').textContent = gameState.wave;
            document.getElementById('max-wave').textContent = WAVES.length;
            document.getElementById('kills').textContent = gameState.kills;

            document.querySelectorAll('.tower-btn').forEach(btn => {
                const wKey = btn.dataset.tower;
                if (wKey && ALL_WEAPONS[wKey]) {
                    btn.classList.toggle('disabled', gameState.gold < ALL_WEAPONS[wKey].cost);
                }
            });
        }

        function endGame(victory) {
            gameState.gameOver = true;
            document.getElementById('game-over').style.display = 'block';
            document.getElementById('result-text').textContent = victory ? '🎉 VICTORY!' : '💀 GAME OVER';
            document.getElementById('result-text').className = victory ? 'victory' : 'defeat';
            document.getElementById('result-detail').textContent = victory
                ? `全${WAVES.length}ウェーブクリア！ 撃破:${gameState.kills}`
                : `Wave ${gameState.wave} 敗北... 撃破:${gameState.kills}`;
            playSound(victory ? 'victory' : 'gameover');
        }

        function restartGame() {
            gameState = initState();
            document.getElementById('game-over').style.display = 'none';
            document.getElementById('weapon-select').style.display = 'none';
            document.getElementById('start-btn').disabled = false;
            document.getElementById('start-btn').textContent = '🚀 ウェーブ開始';
            updateTowerPanel();
            updateUI();
            requestAnimationFrame(gameLoop);
        }

        window.addEventListener('load', init);
    </script>
</body>
</html>
