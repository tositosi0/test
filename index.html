<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tower Defense</title>
    <link rel="manifest" href="manifest.json">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            height: 100%;
            overflow: hidden;
            background: #1a1a2e;
            font-family: 'Segoe UI', sans-serif;
            color: #eee;
        }
        #app {
            display: flex;
            flex-direction: column;
            height: 100%;
            max-width: 500px;
            margin: 0 auto;
        }
        #game-header {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 6px 10px;
            background: #16213e;
            flex-shrink: 0;
        }
        .stat { display: flex; align-items: center; gap: 3px; font-size: 12px; }
        .stat-icon { font-size: 14px; }
        #game-container {
            flex: 1;
            position: relative;
            touch-action: none;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background: #0f0f23;
        }
        #game-canvas { display: block; }
        #tower-panel {
            display: flex;
            justify-content: center;
            gap: 4px;
            padding: 6px;
            background: #16213e;
            flex-shrink: 0;
            flex-wrap: wrap;
        }
        .tower-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 4px 6px;
            border: 2px solid #333;
            border-radius: 6px;
            background: #1a1a2e;
            color: #eee;
            cursor: pointer;
            min-width: 52px;
        }
        .tower-btn.selected { border-color: #4a9eff; background: #2a2a5a; }
        .tower-btn.disabled { opacity: 0.5; }
        .tower-icon { font-size: 18px; }
        .tower-name { font-size: 9px; font-weight: bold; }
        .tower-cost { font-size: 8px; color: #ffd700; }
        #wave-info {
            padding: 8px;
            background: #16213e;
            text-align: center;
            flex-shrink: 0;
        }
        #start-btn {
            padding: 10px 25px;
            font-size: 14px;
            background: #4a9eff;
            border: none;
            border-radius: 6px;
            color: white;
            cursor: pointer;
        }
        #start-btn:disabled { opacity: 0.7; }
        #upgrade-panel {
            display: none;
            position: absolute;
            background: #16213e;
            border: 2px solid #4a9eff;
            border-radius: 8px;
            padding: 8px;
            z-index: 100;
            min-width: 130px;
            font-size: 12px;
        }
        #upgrade-panel h3 { font-size: 12px; margin-bottom: 5px; color: #4a9eff; }
        .upgrade-btn {
            display: block;
            width: 100%;
            padding: 6px;
            margin: 3px 0;
            border: 1px solid #444;
            border-radius: 4px;
            background: #1a1a2e;
            color: #eee;
            cursor: pointer;
            font-size: 11px;
        }
        .upgrade-btn:disabled { opacity: 0.5; }
        #game-over {
            display: none;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            padding: 25px;
            border-radius: 10px;
            text-align: center;
            z-index: 200;
        }
        #game-over h2 { font-size: 24px; margin-bottom: 10px; }
        .victory { color: #4aff4a; }
        .defeat { color: #ff4a4a; }
        #restart-btn {
            padding: 10px 25px;
            font-size: 14px;
            background: #4a9eff;
            border: none;
            border-radius: 5px;
            color: white;
            cursor: pointer;
            margin-top: 10px;
        }
        #tutorial {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.92);
            z-index: 300;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
        }
        #tutorial h2 { color: #4a9eff; margin-bottom: 15px; font-size: 22px; }
        #tutorial p { margin: 6px 0; font-size: 14px; }
        .step { color: #ffd700; }
        #start-game-btn {
            margin-top: 20px;
            padding: 12px 30px;
            font-size: 16px;
            background: #4a9eff;
            border: none;
            border-radius: 8px;
            color: white;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="tutorial">
        <h2>🏰 タワーディフェンス</h2>
        <div>
            <p><span class="step">①</span> 下のタワーを選んでタップ</p>
            <p><span class="step">②</span> 青エリア（下部）に配置</p>
            <p><span class="step">③</span> 「開始」ボタンで敵が来る</p>
            <p><span class="step">④</span> 敵を倒してゴールドGET</p>
            <p style="color:#ff6b6b; margin-top:12px;">⚠️ 敵が下まで来るとライフ減少</p>
        </div>
        <button id="start-game-btn">ゲームスタート！</button>
        <div style="position:absolute; bottom:10px; right:10px; font-size:10px; color:#666;">v1.2.0</div>
    </div>

    <div id="app">
        <div id="game-header">
            <div class="stat"><span class="stat-icon">💰</span><span id="gold">100</span></div>
            <div class="stat"><span class="stat-icon">❤️</span><span id="lives">20</span></div>
            <div class="stat"><span class="stat-icon">🌊</span><span id="wave">0</span>/<span id="max-wave">10</span></div>
            <div class="stat"><span class="stat-icon">💀</span><span id="kills">0</span></div>
        </div>

        <div id="game-container">
            <canvas id="game-canvas"></canvas>
            <div id="upgrade-panel">
                <h3 id="upgrade-title">タワー</h3>
                <div id="upgrade-info"></div>
                <button id="upgrade-btn" class="upgrade-btn">アップグレード</button>
                <button id="sell-btn" class="upgrade-btn">売却</button>
                <button id="close-panel" class="upgrade-btn">閉じる</button>
            </div>
            <div id="game-over">
                <h2 id="result-text">GAME OVER</h2>
                <p id="result-detail"></p>
                <button id="restart-btn">もう一度</button>
            </div>
        </div>

        <div id="tower-panel">
            <div class="tower-btn" data-tower="basic"><span class="tower-icon">🔫</span><span class="tower-name">ベーシック</span><span class="tower-cost">💰50</span></div>
            <div class="tower-btn" data-tower="shotgun"><span class="tower-icon">🔥</span><span class="tower-name">散弾銃</span><span class="tower-cost">💰80</span></div>
            <div class="tower-btn" data-tower="laser"><span class="tower-icon">⚡</span><span class="tower-name">レーザー</span><span class="tower-cost">💰100</span></div>
            <div class="tower-btn" data-tower="missile"><span class="tower-icon">🚀</span><span class="tower-name">ミサイル</span><span class="tower-cost">💰120</span></div>
            <div class="tower-btn" data-tower="chain"><span class="tower-icon">⛓️</span><span class="tower-name">チェイン</span><span class="tower-cost">💰90</span></div>
        </div>

        <div id="wave-info">
            <button id="start-btn">🚀 ウェーブ開始</button>
        </div>
    </div>

    <script>
        // ゲーム設定
        let CONFIG = { COLS: 10, ROWS: 12, TOWER_ZONE_START: 8 };
        let GRID_SIZE = 32;

        const TOWER_TYPES = {
            basic: { name: 'ベーシック', cost: 50, damage: 10, range: 2.5, fireRate: 1000, color: '#4a9eff', bulletColor: '#4a9eff', bulletSpeed: 8 },
            shotgun: { name: '散弾銃', cost: 80, damage: 8, range: 1.8, fireRate: 1200, color: '#ff9f43', bulletColor: '#ff9f43', bulletSpeed: 12, shotCount: 5, spread: 0.4 },
            laser: { name: 'レーザー', cost: 100, damage: 25, range: 6, fireRate: 800, color: '#ff4757', bulletColor: '#ff4757', isLaser: true },
            missile: { name: 'ミサイル', cost: 120, damage: 40, range: 4, fireRate: 2000, color: '#5f27cd', bulletColor: '#5f27cd', bulletSpeed: 4, isMissile: true, explosionRadius: 1.2 },
            chain: { name: 'チェイン', cost: 90, damage: 15, range: 3, fireRate: 1000, color: '#00d2d3', bulletColor: '#00d2d3', isChain: true, chainCount: 3, chainRange: 2 }
        };

        const ENEMY_TYPES = {
            normal: { hp: 30, speed: 1, reward: 10, color: '#ff6b6b', size: 0.3 },
            fast: { hp: 20, speed: 2, reward: 15, color: '#ffd93d', size: 0.25 },
            tank: { hp: 100, speed: 0.5, reward: 30, color: '#6bcb77', size: 0.4 },
            boss: { hp: 300, speed: 0.3, reward: 100, color: '#9b59b6', size: 0.55 },
            swarm: { hp: 10, speed: 1.5, reward: 5, color: '#e67e22', size: 0.2 }
        };

        const WAVES = [
            { enemies: [{ type: 'normal', count: 5, interval: 1500 }] },
            { enemies: [{ type: 'normal', count: 8, interval: 1200 }] },
            { enemies: [{ type: 'normal', count: 5, interval: 1200 }, { type: 'fast', count: 3, interval: 800 }] },
            { enemies: [{ type: 'normal', count: 6, interval: 1000 }, { type: 'tank', count: 2, interval: 2000 }] },
            { enemies: [{ type: 'fast', count: 8, interval: 600 }, { type: 'normal', count: 5, interval: 1000 }] },
            { enemies: [{ type: 'swarm', count: 15, interval: 400 }, { type: 'tank', count: 2, interval: 2500 }] },
            { enemies: [{ type: 'normal', count: 10, interval: 800 }, { type: 'fast', count: 6, interval: 600 }, { type: 'tank', count: 3, interval: 2000 }] },
            { enemies: [{ type: 'swarm', count: 20, interval: 300 }, { type: 'fast', count: 10, interval: 500 }] },
            { enemies: [{ type: 'tank', count: 5, interval: 1500 }, { type: 'fast', count: 8, interval: 600 }, { type: 'normal', count: 8, interval: 800 }] },
            { enemies: [{ type: 'normal', count: 10, interval: 800 }, { type: 'tank', count: 3, interval: 2000 }, { type: 'boss', count: 1, interval: 5000 }] }
        ];

        let canvas, ctx, gameState;

        function initState() {
            return {
                gold: 100, lives: 20, wave: 0, kills: 0,
                selectedTower: null, towers: [], enemies: [], bullets: [], particles: [],
                lasers: [], chains: [],
                waveInProgress: false, gameOver: false, spawnQueue: [], selectedPlacedTower: null,
                shake: 0
            };
        }

        // レーザー用：点と線分の距離
        function pointToLineDistance(px, py, x1, y1, x2, y2) {
            const A = px - x1, B = py - y1, C = x2 - x1, D = y2 - y1;
            const dot = A * C + B * D;
            const lenSq = C * C + D * D;
            let param = lenSq !== 0 ? dot / lenSq : -1;
            param = Math.max(0, Math.min(1, param));
            const xx = x1 + param * C, yy = y1 + param * D;
            return Math.sqrt((px - xx) ** 2 + (py - yy) ** 2);
        }

        function resizeCanvas() {
            const container = document.getElementById('game-container');
            const maxW = container.clientWidth;
            const maxH = container.clientHeight;

            // グリッドサイズを画面に合わせて計算
            const gw = Math.floor(maxW / CONFIG.COLS);
            const gh = Math.floor(maxH / CONFIG.ROWS);
            GRID_SIZE = Math.min(gw, gh, 40);

            canvas.width = CONFIG.COLS * GRID_SIZE;
            canvas.height = CONFIG.ROWS * GRID_SIZE;
        }

        function init() {
            gameState = initState();
            canvas = document.getElementById('game-canvas');
            ctx = canvas.getContext('2d');

            resizeCanvas();
            window.addEventListener('resize', () => { resizeCanvas(); });

            document.querySelectorAll('.tower-btn').forEach(btn => {
                btn.addEventListener('click', () => selectTower(btn.dataset.tower));
            });

            canvas.addEventListener('click', e => {
                const r = canvas.getBoundingClientRect();
                const scaleX = canvas.width / r.width;
                const scaleY = canvas.height / r.height;
                handlePlacement((e.clientX - r.left) * scaleX, (e.clientY - r.top) * scaleY);
            });

            canvas.addEventListener('touchstart', e => {
                e.preventDefault();
                const r = canvas.getBoundingClientRect();
                const t = e.touches[0];
                const scaleX = canvas.width / r.width;
                const scaleY = canvas.height / r.height;
                handlePlacement((t.clientX - r.left) * scaleX, (t.clientY - r.top) * scaleY);
            });

            document.getElementById('start-btn').addEventListener('click', startWave);
            document.getElementById('upgrade-btn').addEventListener('click', upgradeTower);
            document.getElementById('sell-btn').addEventListener('click', sellTower);
            document.getElementById('close-panel').addEventListener('click', closeUpgradePanel);
            document.getElementById('restart-btn').addEventListener('click', restartGame);
            document.getElementById('start-game-btn').addEventListener('click', () => {
                document.getElementById('tutorial').style.display = 'none';
            });

            updateUI();
            requestAnimationFrame(gameLoop);
        }

        function selectTower(type) {
            document.querySelectorAll('.tower-btn').forEach(btn => btn.classList.remove('selected'));
            gameState.selectedTower = gameState.selectedTower === type ? null : type;
            if (gameState.selectedTower) document.querySelector(`[data-tower="${type}"]`).classList.add('selected');
            closeUpgradePanel();
        }

        function handlePlacement(x, y) {
            const col = Math.floor(x / GRID_SIZE);
            const row = Math.floor(y / GRID_SIZE);

            const existing = gameState.towers.find(t => t.col === col && t.row === row);
            if (existing) { showUpgradePanel(existing); return; }

            closeUpgradePanel();
            if (!gameState.selectedTower) return;

            const tt = TOWER_TYPES[gameState.selectedTower];
            if (gameState.gold < tt.cost || row < CONFIG.TOWER_ZONE_START) return;

            gameState.towers.push({
                type: gameState.selectedTower, col, row,
                x: col * GRID_SIZE + GRID_SIZE / 2,
                y: row * GRID_SIZE + GRID_SIZE / 2,
                level: 1, lastFire: 0, ...tt
            });
            gameState.gold -= tt.cost;
            updateUI();
            gameState.selectedTower = null;
            document.querySelectorAll('.tower-btn').forEach(btn => btn.classList.remove('selected'));
        }

        function showUpgradePanel(tower) {
            gameState.selectedPlacedTower = tower;
            const panel = document.getElementById('upgrade-panel');
            const uc = Math.floor(tower.cost * tower.level * 0.75);
            const sp = Math.floor(tower.cost * tower.level * 0.5);

            document.getElementById('upgrade-title').textContent = `${tower.name} Lv.${tower.level}`;
            document.getElementById('upgrade-info').innerHTML = `攻撃:${tower.damage} 射程:${tower.range.toFixed(1)}`;
            document.getElementById('upgrade-btn').textContent = `強化(💰${uc})`;
            document.getElementById('upgrade-btn').disabled = gameState.gold < uc || tower.level >= 5;
            document.getElementById('sell-btn').textContent = `売却(💰${sp})`;

            panel.style.display = 'block';
            panel.style.left = Math.min(tower.x, canvas.width - 140) + 'px';
            panel.style.top = Math.min(tower.y, canvas.height - 120) + 'px';
        }

        function closeUpgradePanel() {
            document.getElementById('upgrade-panel').style.display = 'none';
            gameState.selectedPlacedTower = null;
        }

        function upgradeTower() {
            const t = gameState.selectedPlacedTower;
            if (!t || t.level >= 5) return;
            const uc = Math.floor(t.cost * t.level * 0.75);
            if (gameState.gold < uc) return;

            gameState.gold -= uc;
            t.level++;
            t.damage = Math.floor(t.damage * 1.4);
            t.range += 0.3;
            t.fireRate = Math.floor(t.fireRate * 0.9);
            updateUI();
            showUpgradePanel(t);
        }

        function sellTower() {
            const t = gameState.selectedPlacedTower;
            if (!t) return;
            gameState.gold += Math.floor(t.cost * t.level * 0.5);
            const i = gameState.towers.indexOf(t);
            if (i > -1) gameState.towers.splice(i, 1);
            updateUI();
            closeUpgradePanel();
        }

        function startWave() {
            if (gameState.waveInProgress || gameState.gameOver || gameState.wave >= WAVES.length) return;

            gameState.waveInProgress = true;
            gameState.wave++;
            updateUI();

            document.getElementById('start-btn').disabled = true;
            document.getElementById('start-btn').textContent = '⚔️ 戦闘中';

            const wd = WAVES[gameState.wave - 1];
            gameState.spawnQueue = [];
            let delay = 0;
            wd.enemies.forEach(g => {
                for (let i = 0; i < g.count; i++) {
                    gameState.spawnQueue.push({ type: g.type, spawnTime: Date.now() + delay });
                    delay += g.interval;
                }
            });
        }

        function spawnEnemy(type) {
            const et = ENEMY_TYPES[type];
            const col = Math.floor(Math.random() * CONFIG.COLS);
            gameState.enemies.push({
                x: col * GRID_SIZE + GRID_SIZE / 2,
                y: -GRID_SIZE / 2,
                hp: et.hp, maxHp: et.hp,
                speed: et.speed, baseSpeed: et.speed,
                reward: et.reward, color: et.color,
                size: et.size * GRID_SIZE,
                slowUntil: 0
            });
        }

        function gameLoop() {
            if (gameState.gameOver) { render(); return; }
            update();
            render();
            requestAnimationFrame(gameLoop);
        }

        function update() {
            const now = Date.now();

            // スポーン
            gameState.spawnQueue = gameState.spawnQueue.filter(s => {
                if (now >= s.spawnTime) { spawnEnemy(s.type); return false; }
                return true;
            });

            // ウェーブ終了チェック
            if (gameState.waveInProgress && gameState.spawnQueue.length === 0 && gameState.enemies.length === 0) {
                gameState.waveInProgress = false;
                document.getElementById('start-btn').disabled = false;

                if (gameState.wave >= WAVES.length) {
                    endGame(true);
                } else {
                    document.getElementById('start-btn').textContent = `🚀 Wave ${gameState.wave + 1}`;
                    gameState.gold += 20 + gameState.wave * 5;
                    updateUI();
                }
            }

            // 敵移動
            gameState.enemies.forEach(e => {
                e.speed = now < e.slowUntil ? e.baseSpeed * 0.5 : e.baseSpeed;
                e.y += e.speed;
                if (e.y >= canvas.height) {
                    gameState.lives--;
                    e.hp = 0;
                    updateUI();
                    if (gameState.lives <= 0) endGame(false);
                }
            });
            gameState.enemies = gameState.enemies.filter(e => e.hp > 0);

            // タワー攻撃
            gameState.towers.forEach(t => {
                if (now - t.lastFire < t.fireRate) return;

                let target = null, minD = Infinity;
                gameState.enemies.forEach(e => {
                    const d = Math.sqrt((e.x - t.x) ** 2 + (e.y - t.y) ** 2) / GRID_SIZE;
                    if (d <= t.range && d < minD) { minD = d; target = e; }
                });

                if (target) {
                    t.lastFire = now;

                    // レーザー：即時ヒット＆貫通
                    if (t.isLaser) {
                        const angle = Math.atan2(target.y - t.y, target.x - t.x);
                        const laserEnd = { x: t.x + Math.cos(angle) * t.range * GRID_SIZE, y: t.y + Math.sin(angle) * t.range * GRID_SIZE };

                        // レーザーライン上の敵全員にダメージ
                        gameState.enemies.forEach(e => {
                            const dist = pointToLineDistance(e.x, e.y, t.x, t.y, laserEnd.x, laserEnd.y);
                            if (dist < e.size + 5) {
                                dealDamage(e, t.damage);
                            }
                        });

                        // レーザーエフェクト
                        gameState.lasers.push({ x1: t.x, y1: t.y, x2: laserEnd.x, y2: laserEnd.y, color: t.bulletColor, life: 8 });
                    }
                    // チェイン：連鎖ダメージ
                    else if (t.isChain) {
                        let chainTargets = [target];
                        let lastTarget = target;
                        dealDamage(target, t.damage);

                        for (let i = 1; i < t.chainCount; i++) {
                            let nextTarget = null, nextDist = Infinity;
                            gameState.enemies.forEach(e => {
                                if (chainTargets.includes(e) || e.hp <= 0) return;
                                const d = Math.sqrt((e.x - lastTarget.x) ** 2 + (e.y - lastTarget.y) ** 2) / GRID_SIZE;
                                if (d <= t.chainRange && d < nextDist) { nextDist = d; nextTarget = e; }
                            });
                            if (nextTarget) {
                                gameState.chains.push({ x1: lastTarget.x, y1: lastTarget.y, x2: nextTarget.x, y2: nextTarget.y, color: t.bulletColor, life: 12 });
                                dealDamage(nextTarget, t.damage * (1 - i * 0.2));
                                chainTargets.push(nextTarget);
                                lastTarget = nextTarget;
                            }
                        }
                        gameState.chains.push({ x1: t.x, y1: t.y, x2: target.x, y2: target.y, color: t.bulletColor, life: 12 });
                    }
                    // 散弾銃：複数弾発射
                    else if (t.shotCount) {
                        const baseAngle = Math.atan2(target.y - t.y, target.x - t.x);
                        for (let i = 0; i < t.shotCount; i++) {
                            const angle = baseAngle + (i - (t.shotCount - 1) / 2) * t.spread;
                            gameState.bullets.push({
                                x: t.x, y: t.y,
                                vx: Math.cos(angle) * t.bulletSpeed,
                                vy: Math.sin(angle) * t.bulletSpeed,
                                damage: t.damage, speed: t.bulletSpeed,
                                color: t.bulletColor, isShotgun: true, range: t.range * GRID_SIZE,
                                startX: t.x, startY: t.y
                            });
                        }
                    }
                    // ミサイル：追尾＆爆発
                    else if (t.isMissile) {
                        const angle = Math.atan2(target.y - t.y, target.x - t.x);
                        gameState.bullets.push({
                            x: t.x, y: t.y, target,
                            vx: Math.cos(angle) * 2, vy: Math.sin(angle) * 2,
                            damage: t.damage, speed: t.bulletSpeed || 4,
                            color: t.bulletColor, isMissile: true, explosionRadius: t.explosionRadius
                        });
                    }
                    // 通常弾
                    else {
                        gameState.bullets.push({
                            x: t.x, y: t.y, target,
                            damage: t.damage, speed: t.bulletSpeed || 8,
                            color: t.bulletColor
                        });
                    }
                }
            });

            // 弾移動
            gameState.bullets = gameState.bullets.filter(b => {
                // 散弾銃の弾（直進、距離制限）
                if (b.isShotgun) {
                    b.x += b.vx;
                    b.y += b.vy;
                    const traveled = Math.sqrt((b.x - b.startX) ** 2 + (b.y - b.startY) ** 2);
                    if (traveled > b.range) return false;

                    // 敵に当たったかチェック
                    for (let e of gameState.enemies) {
                        const d = Math.sqrt((e.x - b.x) ** 2 + (e.y - b.y) ** 2);
                        if (d < e.size + 5) {
                            dealDamage(e, b.damage);
                            return false;
                        }
                    }
                    return true;
                }

                // ミサイル（追尾）
                if (b.isMissile && b.target.hp > 0) {
                    const dx = b.target.x - b.x, dy = b.target.y - b.y;
                    const d = Math.sqrt(dx * dx + dy * dy);
                    if (d < 15) {
                        // 爆発
                        gameState.enemies.forEach(e => {
                            const ed = Math.sqrt((e.x - b.x) ** 2 + (e.y - b.y) ** 2) / GRID_SIZE;
                            if (ed <= b.explosionRadius) {
                                dealDamage(e, b.damage * (1 - ed / b.explosionRadius * 0.3));
                            }
                        });
                        createExplosion(b.x, b.y, b.color);
                        return false;
                    }
                    // 追尾移動
                    const angle = Math.atan2(dy, dx);
                    b.vx = b.vx * 0.9 + Math.cos(angle) * b.speed * 0.3;
                    b.vy = b.vy * 0.9 + Math.sin(angle) * b.speed * 0.3;
                    b.x += b.vx;
                    b.y += b.vy;
                    // ミサイル煙
                    if (Math.random() < 0.5) {
                        gameState.particles.push({
                            x: b.x, y: b.y, vx: (Math.random()-0.5)*2, vy: (Math.random()-0.5)*2,
                            color: '#888', size: 3, life: 10, type: 'smoke'
                        });
                    }
                    return true;
                }

                // 通常弾
                if (!b.target || b.target.hp <= 0) return false;
                const dx = b.target.x - b.x, dy = b.target.y - b.y;
                const d = Math.sqrt(dx * dx + dy * dy);

                if (d < 10) {
                    dealDamage(b.target, b.damage);
                    return false;
                }

                b.vx = dx / d * b.speed;
                b.vy = dy / d * b.speed;
                b.x += b.vx;
                b.y += b.vy;
                return true;
            });

            // パーティクル
            gameState.particles = gameState.particles.filter(p => {
                p.x += p.vx; p.y += p.vy;
                p.life--;
                if (p.type !== 'smoke') p.vy += 0.1;
                return p.life > 0;
            });

            // レーザー減衰
            gameState.lasers = gameState.lasers.filter(l => {
                l.life--;
                return l.life > 0;
            });

            // チェイン減衰
            gameState.chains = gameState.chains.filter(c => {
                c.life--;
                return c.life > 0;
            });
        }

        function dealDamage(e, dmg) {
            e.hp -= dmg;

            // ヒットエフェクト（ダメージ時に小さい火花）
            for (let i = 0; i < 3; i++) {
                gameState.particles.push({
                    x: e.x + (Math.random() - 0.5) * e.size,
                    y: e.y + (Math.random() - 0.5) * e.size,
                    vx: (Math.random() - 0.5) * 3,
                    vy: (Math.random() - 0.5) * 3,
                    color: '#fff', size: 2, life: 8, type: 'spark'
                });
            }

            if (e.hp <= 0) {
                gameState.gold += e.reward;
                gameState.kills++;
                updateUI();

                // 画面シェイク
                gameState.shake = 5;

                // メイン爆発パーティクル
                for (let i = 0; i < 20; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = 2 + Math.random() * 5;
                    gameState.particles.push({
                        x: e.x, y: e.y,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed,
                        color: e.color,
                        size: 3 + Math.random() * 5,
                        life: 20 + Math.random() * 15,
                        type: 'explosion'
                    });
                }

                // 白い火花
                for (let i = 0; i < 8; i++) {
                    gameState.particles.push({
                        x: e.x, y: e.y,
                        vx: (Math.random() - 0.5) * 8,
                        vy: (Math.random() - 0.5) * 8,
                        color: '#fff',
                        size: 2 + Math.random() * 2,
                        life: 10 + Math.random() * 10,
                        type: 'spark'
                    });
                }

                // リング（衝撃波）
                gameState.particles.push({
                    x: e.x, y: e.y, vx: 0, vy: 0,
                    color: e.color, size: 5, life: 15,
                    type: 'ring', maxSize: e.size * 3
                });
            }
        }

        function createExplosion(x, y, color) {
            // 大爆発（範囲攻撃用）
            gameState.shake = 8;

            // メイン爆発
            for (let i = 0; i < 30; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 3 + Math.random() * 6;
                gameState.particles.push({
                    x, y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    color: i % 3 === 0 ? '#ff0' : color,
                    size: 4 + Math.random() * 6,
                    life: 25 + Math.random() * 15,
                    type: 'explosion'
                });
            }

            // 中心のフラッシュ
            gameState.particles.push({
                x, y, vx: 0, vy: 0,
                color: '#fff', size: GRID_SIZE, life: 8,
                type: 'flash'
            });

            // 複数リング
            for (let i = 0; i < 2; i++) {
                gameState.particles.push({
                    x, y, vx: 0, vy: 0,
                    color: i === 0 ? color : '#ff0',
                    size: 5, life: 20 - i * 5,
                    type: 'ring', maxSize: GRID_SIZE * (2 + i)
                });
            }
        }

        function render() {
            // 画面シェイク
            ctx.save();
            if (gameState.shake > 0) {
                ctx.translate(
                    (Math.random() - 0.5) * gameState.shake * 2,
                    (Math.random() - 0.5) * gameState.shake * 2
                );
                gameState.shake *= 0.8;
                if (gameState.shake < 0.5) gameState.shake = 0;
            }

            ctx.fillStyle = '#0f0f23';
            ctx.fillRect(-10, -10, canvas.width + 20, canvas.height + 20);

            // グリッド
            ctx.strokeStyle = '#1a1a3a';
            ctx.lineWidth = 1;
            for (let x = 0; x <= CONFIG.COLS; x++) {
                ctx.beginPath();
                ctx.moveTo(x * GRID_SIZE, 0);
                ctx.lineTo(x * GRID_SIZE, canvas.height);
                ctx.stroke();
            }
            for (let y = 0; y <= CONFIG.ROWS; y++) {
                ctx.beginPath();
                ctx.moveTo(0, y * GRID_SIZE);
                ctx.lineTo(canvas.width, y * GRID_SIZE);
                ctx.stroke();
            }

            // タワーゾーン
            ctx.fillStyle = 'rgba(74,158,255,0.12)';
            ctx.fillRect(0, CONFIG.TOWER_ZONE_START * GRID_SIZE, canvas.width, (CONFIG.ROWS - CONFIG.TOWER_ZONE_START) * GRID_SIZE);

            ctx.strokeStyle = '#4a9eff';
            ctx.lineWidth = 2;
            ctx.setLineDash([5, 5]);
            ctx.beginPath();
            ctx.moveTo(0, CONFIG.TOWER_ZONE_START * GRID_SIZE);
            ctx.lineTo(canvas.width, CONFIG.TOWER_ZONE_START * GRID_SIZE);
            ctx.stroke();
            ctx.setLineDash([]);

            // 選択中タワー射程
            if (gameState.selectedPlacedTower) {
                const t = gameState.selectedPlacedTower;
                ctx.beginPath();
                ctx.arc(t.x, t.y, t.range * GRID_SIZE, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(74,158,255,0.15)';
                ctx.fill();
            }

            // タワー
            gameState.towers.forEach(t => {
                const s = GRID_SIZE * 0.35;
                ctx.fillStyle = t.color;
                ctx.beginPath();
                ctx.moveTo(t.x, t.y - s);
                ctx.lineTo(t.x + s, t.y + s);
                ctx.lineTo(t.x - s, t.y + s);
                ctx.closePath();
                ctx.fill();

                if (t.level > 1) {
                    ctx.fillStyle = '#fff';
                    ctx.font = `bold ${GRID_SIZE * 0.25}px sans-serif`;
                    ctx.textAlign = 'center';
                    ctx.fillText(`${t.level}`, t.x, t.y + s + GRID_SIZE * 0.3);
                }
            });

            // 敵
            gameState.enemies.forEach(e => {
                const bw = e.size * 1.5, hp = e.hp / e.maxHp;
                ctx.fillStyle = '#333';
                ctx.fillRect(e.x - bw / 2, e.y - e.size - 6, bw, 3);
                ctx.fillStyle = hp > 0.5 ? '#4aff4a' : hp > 0.25 ? '#ffd700' : '#ff4a4a';
                ctx.fillRect(e.x - bw / 2, e.y - e.size - 6, bw * hp, 3);

                ctx.fillStyle = Date.now() < e.slowUntil ? '#4affff' : e.color;
                ctx.beginPath();
                ctx.arc(e.x, e.y, e.size, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(e.x - e.size * 0.3, e.y - e.size * 0.2, e.size * 0.15, 0, Math.PI * 2);
                ctx.arc(e.x + e.size * 0.3, e.y - e.size * 0.2, e.size * 0.15, 0, Math.PI * 2);
                ctx.fill();
            });

            // レーザー描画
            gameState.lasers.forEach(l => {
                const alpha = l.life / 8;
                ctx.globalAlpha = alpha;
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 6;
                ctx.beginPath();
                ctx.moveTo(l.x1, l.y1);
                ctx.lineTo(l.x2, l.y2);
                ctx.stroke();
                ctx.strokeStyle = l.color;
                ctx.lineWidth = 3;
                ctx.shadowColor = l.color;
                ctx.shadowBlur = 15;
                ctx.stroke();
                ctx.shadowBlur = 0;
            });
            ctx.globalAlpha = 1;

            // チェイン（電撃）描画
            gameState.chains.forEach(c => {
                const alpha = c.life / 12;
                ctx.globalAlpha = alpha;
                ctx.strokeStyle = c.color;
                ctx.lineWidth = 2;
                ctx.shadowColor = c.color;
                ctx.shadowBlur = 10;
                ctx.beginPath();
                // ジグザグ電撃
                const dx = c.x2 - c.x1, dy = c.y2 - c.y1;
                const dist = Math.sqrt(dx*dx + dy*dy);
                const segments = Math.max(3, Math.floor(dist / 15));
                ctx.moveTo(c.x1, c.y1);
                for (let i = 1; i < segments; i++) {
                    const t = i / segments;
                    const x = c.x1 + dx * t + (Math.random() - 0.5) * 15;
                    const y = c.y1 + dy * t + (Math.random() - 0.5) * 15;
                    ctx.lineTo(x, y);
                }
                ctx.lineTo(c.x2, c.y2);
                ctx.stroke();
                ctx.shadowBlur = 0;
            });
            ctx.globalAlpha = 1;

            // 弾（トレイル付き）
            gameState.bullets.forEach(b => {
                // ミサイルは特別描画
                if (b.isMissile) {
                    ctx.fillStyle = b.color;
                    ctx.beginPath();
                    ctx.arc(b.x, b.y, 5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#ff0';
                    ctx.beginPath();
                    ctx.arc(b.x - (b.vx || 0) * 0.3, b.y - (b.vy || 0) * 0.3, 3, 0, Math.PI * 2);
                    ctx.fill();
                    return;
                }
                // トレイル
                if (b.vx !== undefined) {
                    ctx.globalAlpha = 0.3;
                    ctx.beginPath();
                    ctx.arc(b.x - b.vx * 0.5, b.y - b.vy * 0.5, 4, 0, Math.PI * 2);
                    ctx.fillStyle = b.color;
                    ctx.fill();
                }
                // メイン
                ctx.globalAlpha = 1;
                ctx.beginPath();
                ctx.arc(b.x, b.y, 4, 0, Math.PI * 2);
                ctx.fillStyle = '#fff';
                ctx.fill();
                ctx.beginPath();
                ctx.arc(b.x, b.y, 3, 0, Math.PI * 2);
                ctx.fillStyle = b.color;
                ctx.fill();
            });

            // パーティクル（タイプ別描画）
            gameState.particles.forEach(p => {
                const alpha = Math.min(1, p.life / 15);
                ctx.globalAlpha = alpha;

                if (p.type === 'ring') {
                    // 衝撃波リング
                    const progress = 1 - (p.life / 15);
                    const radius = p.size + (p.maxSize - p.size) * progress;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, radius, 0, Math.PI * 2);
                    ctx.strokeStyle = p.color;
                    ctx.lineWidth = 3 * alpha;
                    ctx.stroke();
                } else if (p.type === 'flash') {
                    // フラッシュ（中心の光）
                    const gradient = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size);
                    gradient.addColorStop(0, 'rgba(255,255,255,' + alpha + ')');
                    gradient.addColorStop(0.5, 'rgba(255,255,200,' + alpha * 0.5 + ')');
                    gradient.addColorStop(1, 'rgba(255,200,100,0)');
                    ctx.fillStyle = gradient;
                    ctx.fillRect(p.x - p.size, p.y - p.size, p.size * 2, p.size * 2);
                } else if (p.type === 'spark') {
                    // 火花（小さくキラキラ）
                    ctx.fillStyle = p.color;
                    ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
                } else {
                    // 通常パーティクル（グロー付き）
                    ctx.shadowColor = p.color;
                    ctx.shadowBlur = 8;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fillStyle = p.color;
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }
            });
            ctx.globalAlpha = 1;

            // ゴールライン
            ctx.strokeStyle = '#ff4a4a';
            ctx.lineWidth = 3;
            ctx.setLineDash([8, 4]);
            ctx.beginPath();
            ctx.moveTo(0, canvas.height - 3);
            ctx.lineTo(canvas.width, canvas.height - 3);
            ctx.stroke();
            ctx.setLineDash([]);

            ctx.restore(); // シェイク用のrestore
        }

        function updateUI() {
            document.getElementById('gold').textContent = gameState.gold;
            document.getElementById('lives').textContent = gameState.lives;
            document.getElementById('wave').textContent = gameState.wave;
            document.getElementById('max-wave').textContent = WAVES.length;
            document.getElementById('kills').textContent = gameState.kills;

            document.querySelectorAll('.tower-btn').forEach(btn => {
                btn.classList.toggle('disabled', gameState.gold < TOWER_TYPES[btn.dataset.tower].cost);
            });
        }

        function endGame(victory) {
            gameState.gameOver = true;
            document.getElementById('game-over').style.display = 'block';
            document.getElementById('result-text').textContent = victory ? '🎉 VICTORY!' : '💀 GAME OVER';
            document.getElementById('result-text').className = victory ? 'victory' : 'defeat';
            document.getElementById('result-detail').textContent = victory
                ? `全${WAVES.length}ウェーブクリア！ 撃破:${gameState.kills}`
                : `Wave ${gameState.wave} 敗北... 撃破:${gameState.kills}`;
        }

        function restartGame() {
            gameState = initState();
            document.getElementById('game-over').style.display = 'none';
            document.getElementById('start-btn').disabled = false;
            document.getElementById('start-btn').textContent = '🚀 ウェーブ開始';
            updateUI();
            requestAnimationFrame(gameLoop);
        }

        window.addEventListener('load', init);
    </script>
</body>
</html>
